name: Launcher

# The Android launcher in launcher/. Two flows:
# - Every push to master/main and every PR that touches launcher/ (or this workflow, or the
#   build-tsnet action): build and test (debug, unsigned release, lint, unit
#   tests) and upload the debug APK as a workflow artifact. Nothing is published, no secrets.
# - A tag launcher-vX.Y.Z (release) or launcher-vX.Y.Z-rc.N (release candidate) on a commit that
#   is on master/main:
#   launcher-release-build builds the unsigned release APK (no secrets), launcher-release-sign
#   signs and verifies it in the protected "release" environment (no checkout, no Gradle/Go -
#   only apksigner), and launcher-release-publish creates the GitHub Release. A launcher release becomes "latest", so the stable URL
#   releases/latest/download/kids-launcher-mdm.apk (provisioning QR, the server's self-update
#   catalog row) serves it. A release candidate is a prerelease and never becomes "latest", and
#   server releases (server-v*, see server-release.yml) never do either - in this monorepo
#   "latest" always means the newest stable launcher.
#
# One-time setup (repo settings, not code): an environment named "release" with a required
# reviewer and a deployment rule allowing only tags matching launcher-v*; the secrets
# ANDROID_RELEASE_KEYSTORE_B64 / ANDROID_RELEASE_KEYSTORE_PASSWORD / ANDROID_RELEASE_KEY_ALIAS
# stored in that environment (not as repo secrets); and the repo variable RELEASE_CERT_SHA256
# (hex SHA-256 of the signing certificate, from `apksigner verify --print-certs`).
#
# Third-party actions are pinned by commit SHA. Never add a pull_request_target trigger.

# No `paths:` filter on the triggers: a skipped workflow leaves a required check pending forever.
# Instead launcher-changes decides, launcher-build runs only when launcher files changed, and
# launcher-ci (always runs) is the check to require.

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "launcher-v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # golang.org/x/mobile (gomobile/gobind) - must match the version in launcher/mobile/go.mod, which also
  # pins tailscale.com (tsnet) and github.com/wlynxg/anet. Bump them together there.
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  launcher-changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Did launcher files change?
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$BEFORE" ;;
          *) base="" ;;  # workflow_dispatch: always build
        esac
        # No usable base (manual run, new branch, force push): build.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          changed=true
        elif git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(launcher/|\.github/workflows/launcher\.yml$|\.github/actions/build-tsnet/)'; then
          changed=true
        else
          changed=false
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "launcher changed: $changed (base ${base:-none})"

  launcher-build:
    needs: launcher-changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.launcher-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - uses: ./.github/actions/build-tsnet
      with:
        gomobile-version: ${{ env.GOMOBILE_VERSION }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      # Debug, unsigned release, lint and unit tests. No release keystore here: the release
      # build comes out unsigned.
      # Kotlin warnings fail this build (app/build.gradle.kts, warningsAsErrors).
      run: ./gradlew build -PrequireTsnet=true -PwarningsAsErrors=true
    - name: Upload APK
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: launcher-debug-${{ github.sha }}.apk
        path: launcher/app/build/outputs/apk/debug/app-debug.apk

  # The one check to mark as required in branch protection: it always runs and passes when the
  # build passed, or was skipped because nothing of launcher's changed.
  launcher-ci:
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    needs: [ launcher-changes, launcher-build ]
    runs-on: ubuntu-24.04
    steps:
    - name: Check launcher-build
      env:
        CHANGES: ${{ needs.launcher-changes.result }}
        CHANGED: ${{ needs.launcher-changes.outputs.changed }}
        BUILD: ${{ needs.launcher-build.result }}
      run: |
        echo "changes: $CHANGES, changed: $CHANGED, build: $BUILD"
        [ "$CHANGES" = success ] || exit 1
        if [ "$CHANGED" = true ]; then [ "$BUILD" = success ]; else [ "$BUILD" = skipped ]; fi

  launcher-release-build:
    if: ${{ startsWith(github.ref, 'refs/tags/launcher-v') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Refuse tags whose commit is not on master/main
      run: |
        # Fetch whichever of the two exists (a fetch naming a missing branch fails as a whole).
        for b in main master; do
          git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null || true
        done
        for branch in master main; do
          if git rev-parse --verify -q "origin/$branch" >/dev/null &&
             git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on $branch"
            exit 0
          fi
        done
        echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master or main" >&2
        exit 1
    - name: Derive version from tag
      id: version
      # launcher-vMAJOR.MINOR.PATCH -> versionName MAJOR.MINOR.PATCH, versionCode
      # MAJOR*1_000_000 + MINOR*1_000 + PATCH (launcher-v0.24.0 -> 24000): deterministic,
      # monotonic while tags only go up, and above upstream's 116. The same formula as the old
      # standalone repo's vX.Y.Z tags, so codes keep rising across the move.
      # launcher-vMAJOR.MINOR.PATCH-rc.N -> the same code minus 1 and a prerelease: an RC installs over the
      # previous release (equal or higher code) and the final release installs over the RC. All
      # RCs of one version share a code, which Android allows (same code is not a downgrade).
      run: |
        tag="$GITHUB_REF_NAME"
        if [[ "$tag" =~ ^launcher-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          prerelease=false
        elif [[ "$tag" =~ ^launcher-v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
          prerelease=true
        else
          echo "Tag '$tag' is neither launcher-vMAJOR.MINOR.PATCH nor launcher-vMAJOR.MINOR.PATCH-rc.N" >&2
          exit 1
        fi
        major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
        if (( minor > 999 || patch > 999 || major > 2000 )); then
          echo "Tag '$tag' is out of range (MINOR and PATCH <= 999, MAJOR <= 2000)" >&2
          exit 1
        fi
        code=$(( major * 1000000 + minor * 1000 + patch ))
        if [ "$prerelease" = true ]; then code=$(( code - 1 )); fi
        if (( code < 1 )); then echo "versionCode would be $code" >&2; exit 1; fi
        name="${tag#launcher-v}"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
        echo "versionName $name, versionCode $code, prerelease $prerelease"
    - name: set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: ./.github/actions/build-tsnet
      with:
        gomobile-version: ${{ env.GOMOBILE_VERSION }}
        go-cache: "false"
    - name: Check the Firebase repository variables
      # The build job is deliberately outside the `release` environment (no secrets near Gradle), so
      # it only sees *repository* variables - environment variables of `release` are invisible here.
      env:
        HANDY_FCM_PROJECT_ID: ${{ vars.HANDY_FCM_PROJECT_ID }}
        HANDY_FCM_APPLICATION_ID: ${{ vars.HANDY_FCM_APPLICATION_ID }}
        HANDY_FCM_API_KEY: ${{ vars.HANDY_FCM_API_KEY }}
        HANDY_FCM_SENDER_ID: ${{ vars.HANDY_FCM_SENDER_ID }}
      run: |
        missing=0
        for v in HANDY_FCM_PROJECT_ID HANDY_FCM_APPLICATION_ID HANDY_FCM_API_KEY HANDY_FCM_SENDER_ID; do
          if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: MISSING"; missing=1; fi
        done
        if [ "$missing" = 1 ]; then
          echo "::error::Set the missing values under Settings > Secrets and variables > Actions > Variables > Repository variables (not Environment variables, not Secrets)."
          exit 1
        fi
    - name: Build unsigned release APK
      # No keystore in this job: it runs Gradle plugins and downloads dependencies, so it never
      # gets the signing secrets. Signing happens in launcher-release-sign.
      # The Firebase config (FCM sync nudges, handy step 7) comes from repository *variables*:
      # the values end up inside the APK anyway, so they aren't secrets - only per project.
      # -PrequireFcm=true fails the build if one is missing, so a release never silently ships
      # without FCM (it would still work, over the SSE stream, at a higher battery cost).
      env:
        HANDY_FCM_PROJECT_ID: ${{ vars.HANDY_FCM_PROJECT_ID }}
        HANDY_FCM_APPLICATION_ID: ${{ vars.HANDY_FCM_APPLICATION_ID }}
        HANDY_FCM_API_KEY: ${{ vars.HANDY_FCM_API_KEY }}
        HANDY_FCM_SENDER_ID: ${{ vars.HANDY_FCM_SENDER_ID }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease testReleaseUnitTest -PrequireTsnet=true -PrequireFcm=true \
          -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"
    - name: Upload unsigned APK
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-unsigned
        path: launcher/app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
        retention-days: 7

  launcher-release-sign:
    needs: launcher-release-build
    runs-on: ubuntu-24.04
    # Holds the signing secrets. Configure it with a required reviewer and a tags-only
    # (launcher-v*) deployment rule, so neither a branch push nor a workflow_dispatch from a branch can use them.
    environment: release
    steps:
    - name: Download unsigned APK
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-unsigned
    - name: Sign
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
          echo "Release signing secrets are missing from the 'release' environment" >&2
          exit 1
        fi
        BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
        umask 077
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
        "$BT/zipalign" -f -P 16 4 app-release-unsigned.apk aligned.apk
        "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
          --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
          --out kids-launcher-mdm.apk aligned.apk
    - name: Remove keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/release.p12"
    - name: Verify
      env:
        EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        set -euo pipefail
        BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
        "$BT/apksigner" verify --print-certs kids-launcher-mdm.apk | tee certs.txt
        actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | tr 'A-F' 'a-f')"
        expected="$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')"
        if [ -z "$expected" ]; then
          echo "Repo variable RELEASE_CERT_SHA256 is not set" >&2
          exit 1
        fi
        if [ "$actual" != "$expected" ]; then
          echo "Signing certificate SHA-256 is $actual, expected $expected" >&2
          exit 1
        fi
        if "$BT/aapt2" dump badging kids-launcher-mdm.apk | grep -q 'application-debuggable'; then
          echo "The release APK is debuggable" >&2
          exit 1
        fi
        "$BT/aapt2" dump badging kids-launcher-mdm.apk | grep "^package:" > badging.txt
        grep -q "name='me.vibb.launcher' " badging.txt \
          || { echo "Unexpected package: $(cat badging.txt)" >&2; exit 1; }
        sha256sum kids-launcher-mdm.apk > kids-launcher-mdm.apk.sha256
    - name: Upload signed APK
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-signed
        path: |
          kids-launcher-mdm.apk
          kids-launcher-mdm.apk.sha256
        if-no-files-found: error

  launcher-release-publish:
    needs: [ launcher-release-build, launcher-release-sign ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Download signed APK
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-signed
    - name: Create GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        tag: ${{ github.ref_name }}
        name: launcher ${{ needs.launcher-release-build.outputs.version-name }}
        prerelease: ${{ needs.launcher-release-build.outputs.prerelease }}
        # A release candidate must never become releases/latest - the phones' self-update and
        # the provisioning QR both follow that URL.
        makeLatest: ${{ needs.launcher-release-build.outputs.prerelease == 'true' && 'false' || 'true' }}
        generateReleaseNotes: true
        artifacts: "kids-launcher-mdm.apk,kids-launcher-mdm.apk.sha256"
        artifactErrorsFailBuild: true
        token: ${{ secrets.GITHUB_TOKEN }}
