name: Server CI

# The admin server in server/. No `paths:` filter on the triggers (a skipped workflow leaves a
# required check pending forever): server-changes decides, server-build runs only when server/ or
# this workflow changed, server-image-context and server-image (a matrix: amd64 and arm64, each on
# a runner of its own architecture) only when the image's files (Dockerfile, .dockerignore,
# deploy/image-smoke.sh) or this workflow changed, and server-ci (always runs) is the check to
# require.
# Third-party actions are pinned by commit SHA. Never add a pull_request_target trigger.

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      image: ${{ steps.diff.outputs.image }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Did server files change?
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$BEFORE" ;;
          *) base="" ;;  # workflow_dispatch: always build
        esac
        # No usable base (manual run, new branch, force push): build.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          changed=true
          image=true
        else
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          # Plus the apps' copies of Spotify's host list (design 26c §8): spotify::tests compares them;
          # and the launcher's copies of the time status report (design 34 P13; devices_list compares it)
          # and the DNS status report (design 36 §4.2; custom_dns compares it), and the release tags'
          # versionCodes (install_now compares it); and the apps' copies of Storytel's token answers
          # (design 58 §8; music_storytel compares them).
          if grep -qE '^(server/|\.github/workflows/server-ci\.yml$|(launcher|music)/app/src/test/resources/spotify_hosts\.json$|launcher/app/src/test/resources/(time_status_report|dns_upstream_status|power_report|zone_status_report|launcher_tag_codes)\.json$|(launcher|music)/app/src/test/resources/storytel_token_answers\.json$)' <<<"$files"; then
            changed=true
          else
            changed=false
          fi
          # The image job (design 22 §6): only when the image's own files or this workflow changed.
          if grep -qE '^(server/Dockerfile|server/\.dockerignore|server/deploy/image-smoke\.sh|\.github/workflows/server-ci\.yml)$' <<<"$files"; then
            image=true
          else
            image=false
          fi
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "server changed: $changed, image: $image (base ${base:-none})"

  server-build:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo build --locked
      - run: cargo fmt --check
      # The full checkout matters: phone::tests compares testdata/phone_vectors.json with the
      # launcher's copy in ../launcher.
      - run: cargo test --locked
      # static/scroll-restore.js (no POST may make a page jump to the top); node is on the runner.
      - run: node --test jstest/*.test.js
      # Reports warnings without failing the build; the existing ones predate the test harness.
      - run: cargo clippy --all-targets --locked

  # The container image (design 22 §6), without pushing, as the release builds it: the static musl
  # binary built natively on a runner of each architecture (plain cargo, no cross, no QEMU), then
  # server-image builds and smoke-tests each architecture's image on its own runner.
  server-image-context:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.image == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: server-image-context (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      # As server-release.yml: musl-gcc for the C in ring and the bundled SQLite, named for cc-rs.
      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Build
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"
      - name: Stage the image context
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCH"
          cp "target/$TARGET/release/kid_phone_server" "dist/$ARCH/"
          cp -r static dist/static
      - name: Upload the image context
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
          if-no-files-found: error
          retention-days: 3

  # The same smoke test the release runs before it tags an image, natively on each architecture.
  server-image:
    needs: server-image-context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: server-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download the image context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
      # Artifacts don't keep the executable bit.
      - name: Make the binary executable
        run: chmod 755 "dist/$ARCH/kid_phone_server"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" \
            -t "handy-server:ci-$ARCH" .
      - name: Smoke test (natively)
        run: deploy/image-smoke.sh "handy-server:ci-$ARCH" "linux/$ARCH"

  # The one check to mark as required in branch protection: it always runs and passes when the
  # build (and the image jobs) passed, or were skipped because nothing of theirs changed.
  server-ci:
    if: ${{ always() }}
    needs: [ server-changes, server-build, server-image-context, server-image ]
    runs-on: ubuntu-24.04
    steps:
    - name: Check server-build and the image jobs
      env:
        CHANGES: ${{ needs.server-changes.result }}
        CHANGED: ${{ needs.server-changes.outputs.changed }}
        IMAGE_CHANGED: ${{ needs.server-changes.outputs.image }}
        BUILD: ${{ needs.server-build.result }}
        IMAGE_CONTEXT: ${{ needs.server-image-context.result }}
        IMAGE: ${{ needs.server-image.result }}
      run: |
        echo "changes: $CHANGES, changed: $CHANGED, build: $BUILD, image changed: $IMAGE_CHANGED, image context: $IMAGE_CONTEXT, image: $IMAGE"
        [ "$CHANGES" = success ] || exit 1
        if [ "$CHANGED" = true ]; then [ "$BUILD" = success ]; else [ "$BUILD" = skipped ]; fi
        if [ "$IMAGE_CHANGED" = true ]; then
          [ "$IMAGE_CONTEXT" = success ] && [ "$IMAGE" = success ]
        else
          [ "$IMAGE_CONTEXT" = skipped ] && [ "$IMAGE" = skipped ]
        fi
