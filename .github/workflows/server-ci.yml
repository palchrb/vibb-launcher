name: Server CI

# The admin server in server/. No `paths:` filter on the triggers (a skipped workflow leaves a
# required check pending forever): server-changes decides, server-build runs only when server/ or
# this workflow changed, server-image-context and server-image (a matrix: amd64 and arm64, each on
# a runner of its own architecture) only when the image's files (Dockerfile, .dockerignore,
# deploy/image-smoke.sh, deploy/distrusted-roots.txt) or this workflow changed, and server-ci (always runs) is the check to
# require.
# Third-party actions are pinned by commit SHA. Never add a pull_request_target trigger.

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      image: ${{ steps.diff.outputs.image }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Did server files change?
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$BEFORE" ;;
          *) base="" ;;  # workflow_dispatch: always build
        esac
        # No usable base (manual run, new branch, force push): build.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          changed=true
          image=true
        else
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          # Plus the apps' copies of Spotify's host list (design 26c §8): spotify::tests compares them;
          # and the launcher's copies of the time status report (design 34 P13; devices_list compares it)
          # and the DNS status report (design 36 §4.2; custom_dns compares it), and the release tags'
          # versionCodes (install_now compares it), and the request for more time (design r13 §2.5;
          # time_request compares it), and the status body's installed versions (2026-10-25;
          # app_updates compares it); and the apps' copies of Storytel's token answers
          # (design 58 §8; music_storytel compares them); and the launcher's built-in secure-DNS
          # hosts (design 67, testdata/doh_hosts.txt; dns_server compares them); and the calendar
          # links' contract (design 72, calendar_feeds.json; calendar_feeds compares it); and the kid's
          # events' write-back contract (design 72b, calendar_kid_events.json; calendar_kid_events compares it); and the
          # weather's contract (design 75, weather.json; weather::tests compares it); and Leave Tailnet's answers
          # (security review S-L10, leave_tailnet.json; tests::leave_tailnet compares them); and the server
          # address rule's vectors (launcher security review S-M1, server_url_vectors.json; config::tests compares them); and
          # the pause's length (2026-11-04, restrictions_pause.json; models::paused_at_tests compares it); and the
          # certificate check's contract (design 76, server_tls_report.json; tests::server_tls compares it); and the SMS
          # engine's contract (design 77, sms_contract.json; sms::tests compares it); and the kid's contact request (design
          # 77 §14, contact_request.json; tests::contact_requests compares it); and the apps' real logos (design 87,
          # app_logos.json; tests::app_logos compares it); and a rule turned on now (design 93, lock_now.json;
          # lock_now::tests compares it); and Mobilnett (designs 94/95, mobile_network.json; tests::mobile_network
          # compares it); and the heartbeat report (design 95 §3.5, status_heartbeat.json; tests::status_heartbeat
          # compares it); and Flymodus (design 98, airplane_mode.json; tests::airplane_mode compares it); and the parent code's
          # rule pause (design 98 §4.4, rule_pause.json; tests::rule_pause compares it); and Snarveier (design 99,
          # shortcuts.json; tests::shortcuts compares it); and Wi-Fi sign-in and Chrome only for logins (design 102,
          # login_windows.json; tests::logins compares it); and the blocked notification channels (design 107,
          # notification_channels.json; tests::notification_channels compares it); and the notification listeners (notification_listeners.json; notification_listeners::tests compares it); and app push (design 108,
          # unified_push.json; tests::unified_push compares it); and the map links' contract folder (design 110,
          # map_links/contract.json; integrations::map_links::tests compares it); and the setup steps (design 114,
          # setup_steps.json; setup_status::tests compares it); and an install failure's reason (upstream review
          # 2026-11-20, install_failure.json; install_failure::tests compares it); and what each app may use (design 127,
          # app_access.json; app_permissions::tests::the_contract compares it); and the Apple Wi-Fi lookup's contract folder (design
          # 125, wifi_lookup/contract.json; integrations::wifi_lookup::tests compares it) and its fixtures script
          # (scripts/wifi-lookup-fixtures.py, which wrote server/testdata/wifi_lookup/server.json); and the MMS
          # servers' generator and
          # its sample (design 83, scripts/mmsc-hosts.py; its output server/testdata/mmsc_hosts.txt is compiled in).
          if grep -qE '^(server/|\.github/workflows/server-ci\.yml$|(launcher|music)/app/src/test/resources/spotify_hosts\.json$|launcher/app/src/test/resources/(time_status_report|dns_upstream_status|power_report|zone_status_report|launcher_tag_codes|time_request|installed_apps_report|calendar_title_rules|calendar_status_report|calendar_feeds|emergency_numbers|calendar_kid_events|weather|leave_tailnet|server_url_vectors|restrictions_pause|server_tls_report|sms_contract|contact_request|app_logos|lock_now|mobile_network|status_heartbeat|airplane_mode|rule_pause|shortcuts|login_windows|notification_channels|notification_listeners|unified_push|setup_steps|install_failure|app_access)\.json$|launcher/app/src/test/resources/(map_links|wifi_lookup)/|(launcher|music)/app/src/test/resources/storytel_token_answers\.json$|launcher/app/src/main/assets/dns/doh_hosts\.txt$|launcher/app/src/main/java/com/kidslauncher/mdm/ui/home/HomeModel\.kt$|scripts/mmsc-hosts(\.py|-sample\.xml)$|scripts/wifi-lookup-fixtures\.py$)' <<<"$files"; then
            changed=true
          else
            changed=false
          fi
          # The image job (design 22 §6): only when the image's own files or this workflow changed.
          if grep -qE '^(server/Dockerfile|server/\.dockerignore|server/deploy/image-smoke\.sh|server/deploy/distrusted-roots\.txt|\.github/workflows/server-ci\.yml)$' <<<"$files"; then
            image=true
          else
            image=false
          fi
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "server changed: $changed, image: $image (base ${base:-none})"
    - name: The MMS servers' generator self-test
      # Cheap and always run: scripts/mmsc-hosts.py (design 83 §3) made server/testdata/mmsc_hosts.txt; a hand edit
      # of the list, or a converter that no longer gives the sample's lines, fails here. No network.
      run: python3 -I scripts/mmsc-hosts.py --selftest
    - name: The Apple Wi-Fi lookup's fixtures self-test
      # Cheap and always run: scripts/wifi-lookup-fixtures.py (design 125 step 2) wrote
      # server/testdata/wifi_lookup/server.json (the golden request, fake Apple answers, health rows); a hand edit of
      # the file fails here. No network, never Apple.
      run: python3 -I scripts/wifi-lookup-fixtures.py --selftest
    - name: The fake homeserver's self-test
      # Cheap and always run: scripts/fake-homeserver.py (design 108's emulator gate, docs/testing/emulator.md §6ay)
      # against a loopback recorder. No network.
      run: python3 -I scripts/fake-homeserver.py --selftest
    - name: Install minisign
      # For the self-test below. Bounded: an unbounded `apt-get update` once hung for 51 minutes (2026-11-10).
      timeout-minutes: 3
      run: |
        set -euo pipefail
        sudo timeout 120 apt-get update -qq
        sudo timeout 120 apt-get install -y -qq minisign
    - name: The image update script's self-test
      # Cheap and always run: server/deploy/update-image.sh (the signed image statement's checks, --auto's release
      # pick, the version rules, .env's HANDY_VERSION and its atomic write) on canned data, with a throwaway key pair
      # it makes in a temp dir (nothing committed). No network, no docker; jq is on the runner.
      run: bash server/deploy/update-image.sh --selftest

  server-build:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo build --locked
      - run: cargo fmt --check
      # The full checkout matters: phone::tests compares testdata/phone_vectors.json with the
      # launcher's copy in ../launcher.
      - run: cargo test --locked
      # static/scroll-restore.js (no POST may make a page jump to the top); node is on the runner.
      - run: node --test jstest/*.test.js
      # Reports warnings without failing the build; the existing ones predate the test harness.
      - run: cargo clippy --all-targets --locked
      # The integrations (docs/notes/server/integrations.md): a build without them still compiles (build only; the
      # core's snapshot tests pin the default build).
      - run: cargo check --no-default-features --locked

  # The container image (design 22 §6), without pushing, as the release builds it: the static musl
  # binary built natively on a runner of each architecture (plain cargo, no cross, no QEMU), then
  # server-image builds and smoke-tests each architecture's image on its own runner.
  server-image-context:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.image == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: server-image-context (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      # As server-release.yml: musl-gcc for the C in ring and the bundled SQLite, named for cc-rs.
      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Build
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"
      - name: Stage the image context
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCH"
          cp "target/$TARGET/release/kid_phone_server" "dist/$ARCH/"
          cp -r static dist/static
          # As the release's tarball lays them out (design 108 §11, L8).
          cp ../NOTICE.md dist/NOTICE.md
          mkdir -p dist/LICENSES
          cp src/unified_push/Apache-2.0.txt dist/LICENSES/Apache-2.0.txt
      - name: Upload the image context
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
          if-no-files-found: error
          retention-days: 3

  # The same smoke test the release runs before it tags an image, natively on each architecture.
  server-image:
    needs: server-image-context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: server-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download the image context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
      # Artifacts don't keep the executable bit.
      - name: Make the binary executable
        run: chmod 755 "dist/$ARCH/kid_phone_server"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" \
            -t "handy-server:ci-$ARCH" .
      - name: Smoke test (natively)
        run: deploy/image-smoke.sh "handy-server:ci-$ARCH" "linux/$ARCH"

  # The one check to mark as required in branch protection: it always runs and passes when the
  # build (and the image jobs) passed, or were skipped because nothing of theirs changed.
  server-ci:
    if: ${{ always() }}
    needs: [ server-changes, server-build, server-image-context, server-image ]
    runs-on: ubuntu-24.04
    steps:
    - name: Check server-build and the image jobs
      env:
        CHANGES: ${{ needs.server-changes.result }}
        CHANGED: ${{ needs.server-changes.outputs.changed }}
        IMAGE_CHANGED: ${{ needs.server-changes.outputs.image }}
        BUILD: ${{ needs.server-build.result }}
        IMAGE_CONTEXT: ${{ needs.server-image-context.result }}
        IMAGE: ${{ needs.server-image.result }}
      run: |
        echo "changes: $CHANGES, changed: $CHANGED, build: $BUILD, image changed: $IMAGE_CHANGED, image context: $IMAGE_CONTEXT, image: $IMAGE"
        [ "$CHANGES" = success ] || exit 1
        if [ "$CHANGED" = true ]; then [ "$BUILD" = success ]; else [ "$BUILD" = skipped ]; fi
        if [ "$IMAGE_CHANGED" = true ]; then
          [ "$IMAGE_CONTEXT" = success ] && [ "$IMAGE" = success ]
        else
          [ "$IMAGE_CONTEXT" = skipped ] && [ "$IMAGE" = skipped ]
        fi
