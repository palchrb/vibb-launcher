name: Server CI

# The admin server in server/. No `paths:` filter on the triggers (a skipped workflow leaves a
# required check pending forever): server-changes decides, server-build runs only when server/ or
# this workflow changed, server-image-context and server-image (a matrix: amd64 and arm64, each on
# a runner of its own architecture) only when the image's files (Dockerfile, .dockerignore,
# deploy/image-smoke.sh, deploy/distrusted-roots.txt) or this workflow changed, and server-ci (always runs) is the check to
# require.
# Third-party actions are pinned by commit SHA. Never add a pull_request_target trigger.

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      image: ${{ steps.diff.outputs.image }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Did server files change?
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          push) base="$BEFORE" ;;
          *) base="" ;;  # workflow_dispatch: always build
        esac
        # No usable base (manual run, new branch, force push): build.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          changed=true
          image=true
        else
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          # Plus contracts/, which both sides read (design 133; the bridge's AIDL in it is the one file the
          # server doesn't read - a run more, never one missed); the launcher's HomeModel.kt (the avatar palette
          # the PWA mirrors); the MMS servers' generator and its sample (design 83, scripts/mmsc-hosts.py; its
          # output server/testdata/mmsc_hosts.txt is compiled in); the Apple Wi-Fi lookup's fixtures script
          # (scripts/wifi-lookup-fixtures.py, which wrote server/testdata/wifi_lookup/server.json); and design
          # 129's scripts: the GrapheneOS boot keys (scripts/grapheneos-boot-keys.py and its sample; its output
          # src/attestation/grapheneos_boot_keys.json is compiled in), the phone key's contract vectors
          # (scripts/device-key-vectors.py, which wrote contracts/core/device_key.json) and the emulator profile's
          # vectors (scripts/emulator-attestation-vectors.py, design 129b §7: server/testdata/attestation/emulator/).
          if grep -qE '^(server/|contracts/|\.github/workflows/server-ci\.yml$|launcher/app/src/main/java/com/kidslauncher/mdm/ui/home/HomeModel\.kt$|scripts/mmsc-hosts(\.py|-sample\.xml)$|scripts/wifi-lookup-fixtures\.py$|scripts/grapheneos-boot-keys(\.py|-sample/.*)$|scripts/(device-key|emulator-attestation)-vectors\.py$|scripts/emulator-attestation-captures/)' <<<"$files"; then
            changed=true
          else
            changed=false
          fi
          # The image job (design 22 §6): only when the image's own files or this workflow changed.
          if grep -qE '^(server/Dockerfile|server/\.dockerignore|server/deploy/image-smoke\.sh|server/deploy/distrusted-roots\.txt|\.github/workflows/server-ci\.yml)$' <<<"$files"; then
            image=true
          else
            image=false
          fi
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "server changed: $changed, image: $image (base ${base:-none})"
    - name: The MMS servers' generator self-test
      # Cheap and always run: scripts/mmsc-hosts.py (design 83 §3) made server/testdata/mmsc_hosts.txt; a hand edit
      # of the list, or a converter that no longer gives the sample's lines, fails here. No network.
      run: python3 -I scripts/mmsc-hosts.py --selftest
    - name: The Apple Wi-Fi lookup's fixtures self-test
      # Cheap and always run: scripts/wifi-lookup-fixtures.py (design 125 step 2) wrote
      # server/testdata/wifi_lookup/server.json (the golden request, fake Apple answers, health rows); a hand edit of
      # the file fails here. No network, never Apple.
      run: python3 -I scripts/wifi-lookup-fixtures.py --selftest
    - name: The GrapheneOS boot keys' self-test
      # Cheap and always run: scripts/grapheneos-boot-keys.py (design 129 §9) verifies a vendored sample signed by a
      # throwaway key with ssh-keygen, refuses a changed byte and an older timestamp, and checks the committed
      # server/src/attestation/grapheneos_boot_keys.json is the script's form. No network.
      run: python3 -I scripts/grapheneos-boot-keys.py --selftest
    - name: The phone key's contract vectors
      # Cheap and always run: contracts/core/device_key.json is exactly what scripts/device-key-vectors.py writes
      # (design 129 §7.1: a throwaway key from a fake phrase, public data only). No network.
      run: python3 -I scripts/device-key-vectors.py --check
    - name: The emulator profile's vectors
      # Cheap and always run: server/testdata/attestation/emulator/ is exactly what
      # scripts/emulator-attestation-vectors.py writes (design 129b §7: throwaway keys, made-up values, and the
      # gate's real chains copied from scripts/emulator-attestation-captures/). No network.
      run: python3 -I scripts/emulator-attestation-vectors.py --check
    - name: No release names emulator_keys
      # Design 129b §7 (H3): the emulator profile takes keys anyone can make. Beside the compile_error! that refuses
      # it outside a debug build, neither the release workflow nor the image may name it, and neither the release
      # workflow nor server/Cargo.toml may turn debug assertions on (that would let the compile_error! pass).
      run: |
        if grep -n 'emulator_keys' .github/workflows/server-release.yml server/Dockerfile; then
          echo "::error::emulator_keys is for the emulator gate's debug builds only"
          exit 1
        fi
        if grep -niE 'debug-assertions|debug_assertions' .github/workflows/server-release.yml server/Cargo.toml; then
          echo "::error::no debug assertions in a release build (emulator_keys' guard)"
          exit 1
        fi
    - name: The fake homeserver's self-test
      # Cheap and always run: scripts/fake-homeserver.py (design 108's emulator gate, docs/testing/emulator.md §6ay)
      # against a loopback recorder. No network.
      run: python3 -I scripts/fake-homeserver.py --selftest
    - name: Install minisign
      # For the self-test below. Bounded: an unbounded `apt-get update` once hung for 51 minutes (2026-11-10).
      timeout-minutes: 3
      run: |
        set -euo pipefail
        sudo timeout 120 apt-get update -qq
        sudo timeout 120 apt-get install -y -qq minisign
    - name: The image update script's self-test
      # Cheap and always run: server/deploy/update-image.sh (the signed image statement's checks, --auto's release
      # pick, the version rules, .env's HANDY_VERSION and its atomic write) on canned data, with a throwaway key pair
      # it makes in a temp dir (nothing committed). No network, no docker; jq is on the runner.
      run: bash server/deploy/update-image.sh --selftest

  server-build:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo build --locked
      - run: cargo fmt --check
      # The full checkout matters: the tests read ../contracts/ (design 133) and the binary compiles in
      # ../contracts/shipped/launcher-assets/dns/doh_hosts.txt.
      - run: cargo test --locked
      # static/scroll-restore.js (no POST may make a page jump to the top); node is on the runner.
      - run: node --test jstest/*.test.js
      # Reports warnings without failing the build; the existing ones predate the test harness.
      - run: cargo clippy --all-targets --locked
      # The integrations (docs/notes/server/integrations.md): a build without them still compiles (build only; the
      # core's snapshot tests pin the default build).
      - run: cargo check --no-default-features --locked
      # Design 129b §7: the emulator gate's profile can't rot - its clippy and its tests (the debug profile) - and it
      # can't be built for release (the compile_error! in src/attestation/mod.rs).
      - run: cargo clippy --all-targets --features emulator_keys --locked
      - run: cargo test --features emulator_keys --locked -- attestation device_key emulator_keys
      - name: A release build refuses emulator_keys
        run: |
          if cargo check --release --features emulator_keys --locked 2> release-check.log; then
            echo "::error::a release build compiled with emulator_keys"
            exit 1
          fi
          grep -q 'emulator_keys is for debug builds only' release-check.log || { cat release-check.log; exit 1; }

  # The container image (design 22 §6), without pushing, as the release builds it: the static musl
  # binary built natively on a runner of each architecture (plain cargo, no cross, no QEMU), then
  # server-image builds and smoke-tests each architecture's image on its own runner.
  server-image-context:
    needs: server-changes
    if: ${{ needs.server-changes.outputs.image == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: server-image-context (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      # As server-release.yml: musl-gcc for the C in ring and the bundled SQLite, named for cc-rs.
      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Build
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"
      - name: Stage the image context
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCH"
          cp "target/$TARGET/release/kid_phone_server" "dist/$ARCH/"
          cp -r static dist/static
          # As the release's tarball lays them out (design 108 §11, L8).
          cp ../NOTICE.md dist/NOTICE.md
          mkdir -p dist/LICENSES
          cp src/unified_push/Apache-2.0.txt dist/LICENSES/Apache-2.0.txt
      - name: Upload the image context
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
          if-no-files-found: error
          retention-days: 3

  # The same smoke test the release runs before it tags an image, natively on each architecture.
  server-image:
    needs: server-image-context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: server-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download the image context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-context-${{ matrix.arch }}
          path: server/dist
      # Artifacts don't keep the executable bit.
      - name: Make the binary executable
        run: chmod 755 "dist/$ARCH/kid_phone_server"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" \
            -t "handy-server:ci-$ARCH" .
      - name: Smoke test (natively)
        run: deploy/image-smoke.sh "handy-server:ci-$ARCH" "linux/$ARCH"

  # The one check to mark as required in branch protection: it always runs and passes when the
  # build (and the image jobs) passed, or were skipped because nothing of theirs changed.
  server-ci:
    if: ${{ always() }}
    needs: [ server-changes, server-build, server-image-context, server-image ]
    runs-on: ubuntu-24.04
    steps:
    - name: Check server-build and the image jobs
      env:
        CHANGES: ${{ needs.server-changes.result }}
        CHANGED: ${{ needs.server-changes.outputs.changed }}
        IMAGE_CHANGED: ${{ needs.server-changes.outputs.image }}
        BUILD: ${{ needs.server-build.result }}
        IMAGE_CONTEXT: ${{ needs.server-image-context.result }}
        IMAGE: ${{ needs.server-image.result }}
      run: |
        echo "changes: $CHANGES, changed: $CHANGED, build: $BUILD, image changed: $IMAGE_CHANGED, image context: $IMAGE_CONTEXT, image: $IMAGE"
        [ "$CHANGES" = success ] || exit 1
        if [ "$CHANGED" = true ]; then [ "$BUILD" = success ]; else [ "$BUILD" = skipped ]; fi
        if [ "$IMAGE_CHANGED" = true ]; then
          [ "$IMAGE_CONTEXT" = success ] && [ "$IMAGE" = success ]
        else
          [ "$IMAGE_CONTEXT" = skipped ] && [ "$IMAGE" = skipped ]
        fi
