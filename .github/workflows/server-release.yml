name: Server release

# For a tag server-vX.Y.Z on a commit that is on master/main:
# 1. server-release-test: the tag checks, then fmt + tests, once. server-release-build, a matrix: the
#    static musl binary built natively on a runner of its own architecture (aarch64-unknown-linux-musl
#    on ubuntu-24.04-arm, x86_64-unknown-linux-musl on ubuntu-24.04; plain cargo, no cross, no QEMU)
#    and packed as kid-phone-server-<target>.tar.gz (the binary and static/ at the top) with its
#    .sha256: a tarball for each, so the server runs without Docker on either.
# 2. server-release-image (design 22 §6), a matrix: each architecture on a runner of its own
#    (linux/amd64 on ubuntu-24.04, linux/arm64 on ubuntu-24.04-arm; no QEMU), its single-arch image
#    built from that architecture's tarball, pushed by digest only (untagged) and smoke-tested there
#    natively (server/deploy/image-smoke.sh).
# 3. server-release-index (no secrets, read-only): the multi-arch index the two smoke-tested digests
#    make (`imagetools create --dry-run`), exactly the bytes that will be pushed (the one trailing
#    newline the dry run prints is stripped), as the artifact index.json.
# 4. server-release-sign, in the protected "release-server" environment (its deployment rule allows
#    server-v* tags only; the SERVER_MINISIGN_KEY secret lives there, not in the repo): signs both
#    tarballs, update.sh and update-image.sh (uploaded by server-release-scripts, a checkout-only job
#    that runs no toolchain) with minisign (security review M5; the trusted comment
#    is "<file> <tag>"), and the image statement handy-server-image.txt - one line
#    "ghcr.io/<owner>/handy-server@sha256:<the index's digest> <tag>" - after checking that the
#    index names exactly the two tested digests. Every signature is checked against the public key
#    pinned in server/deploy/update-image.sh. It runs no docker, no repo script and no action but
#    download/upload-artifact. No secret, or no pinned key: the run stops here, before any image is
#    tagged or anything is published (server/DEPLOY.md, "Release signing").
# 5. server-release-image-merge (no key) checks the signed statement with update-image.sh
#    --verify-statement and the index's digest again, pushes exactly those index bytes by digest,
#    reads them back (a third match), and only then tags the multi-arch image
#    ghcr.io/<owner>/handy-server X.Y.Z (and latest, if X.Y.Z is the highest server-v* tag - a
#    patch on an older line doesn't take it) and attests its build provenance.
# 6. server-release-publish, last: the GitHub release with both tarballs, their .sha256, update.sh,
#    update-image.sh, the image statement and their signatures, as signed in step 4.
#    server/deploy/install.sh
#    and update.sh (and the in-app update check) look up the newest server-v* release through the
#    GitHub API - never releases/latest, which in this monorepo belongs to the launcher: a server
#    release is published with makeLatest false. Publishing last means the update check can't
#    announce a version whose image is missing or broken.
#
# A run stopped at the environment's approval leaves the two untagged leg images in GHCR, which
# nothing names: nothing is tagged or published.
#
# workflow_dispatch is always a dry run (on a branch or a tag ref): the same tests and both tarballs,
# each image built from its tarball and smoke-tested locally on its architecture's own runner, nothing
# signed, pushed, tagged or published (index, sign, merge and publish are skipped). Only a tag push
# releases.
#
# The GHCR package must be public (design 22, U3): after the first image push, the owner sets its
# visibility once (GitHub > Packages > handy-server > Package settings > Change visibility).
#
# test and build (read-only token, run cargo) are kept apart from the jobs that write (packages,
# contents). Third-party actions are pinned by commit SHA. Never add a pull_request_target
# trigger.

on:
  push:
    tags: [ "server-v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-release-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse tags whose commit is not on master/main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Fetch whichever of the two exists (a fetch naming a missing branch fails as a whole).
          for b in main master; do
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null || true
          done
          for branch in master main; do
            if git rev-parse --verify -q "origin/$branch" >/dev/null &&
               git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on $branch"
              exit 0
            fi
          done
          echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master or main" >&2
          exit 1

      - name: Verify Cargo.toml version matches the tag
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$IS_TAG" = true ]; then
            tag="$GITHUB_REF_NAME"
            if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '$tag' is not server-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [ "server-v$cargo_version" != "$tag" ]; then
              echo "Cargo.toml version ($cargo_version) doesn't match tag ($tag)" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          # The image's latest tag goes only to the highest server release (fetch-depth 0 brings
          # every tag, this one included).
          highest="$(git tag -l 'server-v*' | sed -n -E 's/^server-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V | tail -n 1)"
          if [ "$highest" = "$cargo_version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$cargo_version is not the highest server release ($highest): the image keeps latest where it is"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt

      # The same gate as server-ci.yml, on exactly the tagged commit: nothing is built or published
      # from a commit whose tests fail (clippy stays advisory there, so it isn't repeated here).
      - name: Test
        run: |
          cargo fmt --check
          cargo test --locked

  # The two root scripts the sign job signs, straight from a checkout of the tag: a job of their own
  # that runs no toolchain, cargo or build script, so nothing the build runs can touch them. The sign
  # job itself checks nothing out and runs nothing from the repo.
  server-release-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: server/deploy

      - name: Upload the deploy scripts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-deploy-scripts
          path: |
            server/deploy/update.sh
            server/deploy/update-image.sh
          if-no-files-found: error
          retention-days: 7

  # One leg per architecture, each on a runner of that architecture: a plain cargo build of the
  # static musl binary (no cross, no QEMU). Each leg hands on one artifact, server-tarball-<target>:
  # the tarball (the binary and static/ at the top, as before) and its .sha256. The sign job signs
  # both, and each image leg builds from its own architecture's tarball.
  server-release-build:
    needs: server-release-test
    strategy:
      # Both verdicts in a dry run; a release needs both legs anyway (server-release-sign).
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    name: server-release-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      # musl-gcc compiles the C in ring and the bundled SQLite against musl's headers. cc-rs would
      # look for aarch64-linux-musl-gcc on the arm runner, which Ubuntu doesn't ship, so CC_<target>
      # names musl-gcc on both.
      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Build
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"

      # The tarball must run on any Linux of its architecture: a static binary (no interpreter, no
      # shared libraries) for the right machine.
      - name: Check the binary is static and for its architecture
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/kid_phone_server"
          case "$TARGET" in
            aarch64-*) machine="AArch64" ;;
            x86_64-*) machine="Advanced Micro Devices X86-64" ;;
            *) echo "unknown target $TARGET" >&2; exit 1 ;;
          esac
          header="$(readelf -h "$bin")"
          grep -q "Machine: *$machine$" <<<"$header" || { echo "$header"; echo "$bin isn't $machine" >&2; exit 1; }
          linking="$(readelf -l -d "$bin")"
          if grep -qE 'INTERP|\(NEEDED\)' <<<"$linking"; then
            echo "$linking"
            echo "$bin is dynamically linked" >&2
            exit 1
          fi
          file "$bin"
          # It runs here, natively: the usage text, exit status 2.
          status=0
          "$bin" no-such-command 2>/dev/null || status=$?
          [ "$status" = 2 ] || { echo "$bin no-such-command exited $status, not 2" >&2; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          # Laid out as before: the binary and static/ at the top.
          mkdir -p tarball/LICENSES
          cp "target/$TARGET/release/kid_phone_server" tarball/
          cp -r static tarball/
          # Design 108 §11 (L8): the Apache-2.0 port's licence and the attribution travel with the server.
          cp ../NOTICE.md tarball/NOTICE.md
          cp src/unified_push/Apache-2.0.txt tarball/LICENSES/Apache-2.0.txt
          tar -czf "kid-phone-server-$TARGET.tar.gz" -C tarball .
          # install.sh/update.sh download this and refuse a tarball that doesn't match it.
          sha256sum "kid-phone-server-$TARGET.tar.gz" > "kid-phone-server-$TARGET.tar.gz.sha256"

      - name: Upload the tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-tarball-${{ matrix.target }}
          path: |
            server/kid-phone-server-${{ matrix.target }}.tar.gz
            server/kid-phone-server-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # One leg per architecture, each on a runner of that architecture: the build and the smoke test
  # run natively (no QEMU), from the binary in that architecture's tarball (server-release-build's
  # leg for it). Each leg hands its smoke-tested digest to the merge as an artifact of its own
  # (server-image-digest-<arch>, one file digest-<arch>), not as a job output: a matrix's legs share
  # the job's outputs.
  server-release-image:
    # Pushed by digest only, untagged: nothing names these images until the signed statement is
    # checked (server-release-image-merge). A workflow_dispatch is the dry run.
    needs: [ server-release-test, server-release-build ]
    strategy:
      # Both verdicts in a dry run; a release needs both legs anyway (server-release-image-merge).
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: server-release-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.server-release-test.outputs.version }}
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download this architecture's tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-tarball-${{ matrix.target }}
          path: ${{ runner.temp }}/tarball

      # The image's build context (server/Dockerfile): dist/<arch>/kid_phone_server and dist/static,
      # unpacked from the tarball the release publishes (tar keeps the executable bit).
      - name: Stage the image context
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/tarball"
          (cd "$tarball" && sha256sum -c "kid-phone-server-$TARGET.tar.gz.sha256")
          mkdir "$tarball/unpacked"
          tar -xzf "$tarball/kid-phone-server-$TARGET.tar.gz" -C "$tarball/unpacked"
          mkdir -p "dist/$ARCH"
          install -m 755 "$tarball/unpacked/kid_phone_server" "dist/$ARCH/kid_phone_server"
          cp -r "$tarball/unpacked/static" dist/static
          cp "$tarball/unpacked/NOTICE.md" dist/NOTICE.md
          cp -r "$tarball/unpacked/LICENSES" dist/LICENSES

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server" >> "$GITHUB_OUTPUT"

      # This architecture's image, pushed by digest only: nothing carries X.Y.Z or latest until both
      # legs passed their smoke tests.
      - name: Build and push by digest
        id: push
        if: ${{ env.RELEASE == 'true' }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [[ "$digest" == sha256:* ]] || { echo "no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the pushed image (natively)
        if: ${{ env.RELEASE == 'true' }}
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform "linux/$ARCH" "$REF"
          deploy/image-smoke.sh "$REF" "linux/$ARCH"

      # Only a digest that passed its smoke test reaches the merge.
      - name: Write the digest
        if: ${{ env.RELEASE == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/digest-$ARCH"

      - name: Upload the digest
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Dry run - build and smoke test locally (natively)
        if: ${{ env.RELEASE != 'true' }}
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t "handy-server:dry-$ARCH" .
          deploy/image-smoke.sh "handy-server:dry-$ARCH" "linux/$ARCH"

  # The multi-arch index the two smoke-tested digests make, as the exact bytes the merge will push:
  # the dry run prints them and one newline, which is stripped here (exactly one byte). No secrets,
  # read-only; a tag push only.
  server-release-index:
    needs: [ server-release-test, server-release-image ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download both digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan the index
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server"
          sources=()
          for arch in amd64 arm64; do
            digest="$(head -n 1 "$RUNNER_TEMP/digests/digest-$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the $arch leg's digest isn't sha256: '$digest'" >&2; exit 1; }
            sources+=("$image@$digest")
          done
          mkdir -p "$RUNNER_TEMP/index"
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/index/raw"
          # Exactly one trailing newline, which isn't part of the index: stripped, one byte.
          [ "$(tail -c 1 "$RUNNER_TEMP/index/raw" | od -An -tx1 | tr -d ' \n')" = "0a" ] || {
            echo "the dry run's output doesn't end in a newline" >&2; exit 1; }
          head -c -1 "$RUNNER_TEMP/index/raw" > "$RUNNER_TEMP/index/index.json"
          sha256sum "$RUNNER_TEMP/index/index.json"

      - name: Upload the index
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-index
          path: ${{ runner.temp }}/index/index.json
          if-no-files-found: error
          retention-days: 7

  # Root on every server installs only what this key signed (install.sh and update.sh check the
  # tarballs, update-image.sh the image statement). Only this job sees the key, and it runs no docker,
  # no repo script and no action but download/upload-artifact (no checkout).
  server-release-sign:
    needs: [ server-release-test, server-release-scripts, server-release-build, server-release-index ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    # It takes under a minute; a hung step (2026-11-10: `apt-get update`, 51 minutes until cancelled by hand) ends the job.
    # The wait for the environment's approval is not counted.
    timeout-minutes: 10
    environment: release-server
    permissions:
      contents: read
    steps:
      # Both legs' tarballs (server-tarball-<target>) and the deploy scripts into signed/, the index
      # and the two leg digests beside it.
      - name: Download the tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-tarball-*
          merge-multiple: true
          path: signed

      - name: Download the deploy scripts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-deploy-scripts
          path: signed

      - name: Download the index
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-index
          path: ${{ runner.temp }}/index

      - name: Download both digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Install minisign
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 120 apt-get install -y -qq minisign

      - name: Sign the tarballs, the scripts and the image statement
        env:
          SIGNING_KEY: ${{ secrets.SERVER_MINISIGN_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "The SERVER_MINISIGN_KEY secret is missing from the 'release-server' environment: no server release goes out unsigned (server/DEPLOY.md, Release signing)." >&2
            exit 1
          fi
          pubkey="$(sed -n 's/^SERVER_SIGNING_PUBKEY="\(.*\)"$/\1/p' signed/update-image.sh | head -n 1)"
          if [ -z "$pubkey" ] || [ "$pubkey" = "not-set" ]; then
            echo "No public key is pinned in server/deploy/update-image.sh (SERVER_SIGNING_PUBKEY)." >&2
            exit 1
          fi
          # The index must name exactly the two smoke-tested digests, one per platform, and nothing else.
          index="$RUNNER_TEMP/index/index.json"
          amd64="$(head -n 1 "$RUNNER_TEMP/digests/digest-amd64")"
          arm64="$(head -n 1 "$RUNNER_TEMP/digests/digest-arm64")"
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "a leg's digest isn't sha256: '$digest'" >&2; exit 1; }
          done
          jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
            (.manifests | length) == 2
            and ([.manifests[] | "\(.platform.os)/\(.platform.architecture)=\(.digest)"] | sort)
              == (["linux/amd64=\($amd64)", "linux/arm64=\($arm64)"] | sort)' "$index" >/dev/null 2>&1 || {
            echo "the index doesn't name exactly the two tested images" >&2; exit 1; }
          # The statement: one line, the index's digest over exactly those bytes, and the tag.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server"
          index_digest="sha256:$(sha256sum "$index" | cut -c1-64)"
          printf '%s@%s %s\n' "$image" "$index_digest" "$TAG" > signed/handy-server-image.txt
          cat signed/handy-server-image.txt
          umask 077
          key="$RUNNER_TEMP/server-minisign.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          cd signed
          # Both tarballs, each matching its .sha256, before anything is signed.
          for target in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            sha256sum -c "kid-phone-server-$target.tar.gz.sha256"
          done
          for file in kid-phone-server-aarch64-unknown-linux-musl.tar.gz kid-phone-server-x86_64-unknown-linux-musl.tar.gz update.sh update-image.sh handy-server-image.txt; do
            minisign -S -s "$key" -m "$file" -t "$file $TAG"
            # The secret must match the pinned key, or every server would refuse the release.
            comment="$(minisign -V -Q -P "$pubkey" -m "$file")"
            [ "$comment" = "$file $TAG" ] || { echo "$file: the signature doesn't verify with the pinned key" >&2; exit 1; }
          done
          rm -f "$key"

      - name: Upload the signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-release-signed
          path: signed
          if-no-files-found: error
          retention-days: 7

  # Tags the image only once the signed statement names it: update-image.sh --verify-statement checks
  # the statement with the pinned key, the dry run's digest is computed again the same way, and the
  # two must match; then exactly those bytes are pushed by digest, read back from the registry (the
  # third match), and only then do the tags go on. No key here.
  server-release-image-merge:
    needs: [ server-release-test, server-release-build, server-release-image, server-release-index, server-release-sign ]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') && needs.server-release-test.result == 'success' && needs.server-release-build.result == 'success' && needs.server-release-image.result == 'success' && needs.server-release-index.result == 'success' && needs.server-release-sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.server-release-test.outputs.version }}
      LATEST: ${{ needs.server-release-test.outputs.latest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download both digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Download the signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-release-signed
          path: ${{ runner.temp }}/signed

      - name: Install minisign
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 120 apt-get install -y -qq minisign

      - name: Check the signed statement (the pinned key)
        id: statement
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/signed"
          digest="$(bash server/deploy/update-image.sh --verify-statement "$signed/handy-server-image.txt" \
            "$signed/handy-server-image.txt.minisig" "$VERSION")"
          echo "the signed statement names $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server" >> "$GITHUB_OUTPUT"

      - name: Tag X.Y.Z (and latest, for the highest release)
        id: merge
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          SIGNED: ${{ steps.statement.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SIGNED" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no signed digest: '$SIGNED'" >&2; exit 1; }
          sources=()
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/digests/digest-$arch"
            [ -f "$file" ] || { echo "no digest file from the $arch leg" >&2; exit 1; }
            digest="$(head -n 1 "$file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the $arch leg's digest isn't sha256: '$digest'" >&2; exit 1; }
            sources+=("$IMAGE@$digest")
          done
          # The index must name exactly the two tested platforms before any tag goes on it.
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/raw"
          platforms="$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' "$RUNNER_TEMP/raw" | sort | paste -sd ' ')"
          [ "$platforms" = "linux/amd64 linux/arm64" ] || { echo "the index would carry: '$platforms'" >&2; exit 1; }
          # Its digest, the one trailing newline stripped as the index job did, must be the signed one.
          [ "$(tail -c 1 "$RUNNER_TEMP/raw" | od -An -tx1 | tr -d ' \n')" = "0a" ] || {
            echo "the dry run's output doesn't end in a newline" >&2; exit 1; }
          planned="sha256:$(head -c -1 "$RUNNER_TEMP/raw" | sha256sum | cut -c1-64)"
          [ "$planned" = "$SIGNED" ] || { echo "the index would be $planned, the statement signs $SIGNED" >&2; exit 1; }
          echo "digest match 1: the statement verifies with the pinned key: $SIGNED"
          echo "digest match 2: the planned index: $planned"
          # Exactly those bytes go to the registry, first by digest only (no tag moves), through its API: a
          # short-lived push token for this one repository, never on a command line.
          index="$RUNNER_TEMP/index.json"
          head -c -1 "$RUNNER_TEMP/raw" > "$index"
          media_type="$(jq -r '.mediaType' "$index")"
          [[ "$media_type" =~ ^application/vnd\.(oci\.image\.index\.v1|docker\.distribution\.manifest\.list\.v2)\+json$ ]] || {
            echo "the index's media type is '$media_type'" >&2; exit 1; }
          repo="${IMAGE#ghcr.io/}"
          token="$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GH_TOKEN" \
            | curl -fsS -K - "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull,push" | jq -r '.token')"
          [ -n "$token" ] && [ "$token" != null ] || { echo "no push token from ghcr.io" >&2; exit 1; }
          echo "::add-mask::$token"
          put_index() {
            printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl -fsS -K - -X PUT -H "Content-Type: $media_type" --data-binary "@$index" \
                -o /dev/null -D - "https://ghcr.io/v2/$repo/manifests/$1" \
              | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *//p'
          }
          pushed="$(put_index "$SIGNED")"
          [ "$pushed" = "$SIGNED" ] || { echo "the registry stored $pushed, the statement signs $SIGNED" >&2; exit 1; }
          # The third match, before any tag: what the registry serves under the signed digest.
          digest="$(docker buildx imagetools inspect "$IMAGE@$SIGNED" --format '{{json .Manifest}}' | jq -r '.digest')"
          [ "$digest" = "$SIGNED" ] || { echo "$IMAGE@$SIGNED reads as $digest" >&2; exit 1; }
          echo "digest match 3: the registry holds $IMAGE@$digest"
          # Only now the tags, each the same bytes.
          tags=("$VERSION")
          if [ "$LATEST" = true ]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            pushed="$(put_index "$tag")"
            [ "$pushed" = "$SIGNED" ] || { echo "$IMAGE:$tag was stored as $pushed, not $SIGNED" >&2; exit 1; }
            echo "tagged $IMAGE:$tag"
          done
          echo "digest=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  server-release-publish:
    needs: [ server-release-test, server-release-build, server-release-image, server-release-index, server-release-sign, server-release-image-merge ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-release-signed

      - name: Find this component's previous tag (the release notes compare with it)
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # launcher-v / music-v / server-v: GitHub's default compares with the newest tag of any kind.
          prefix="${TAG%%-v*}-v"
          prev=$( { gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' | grep "^${prefix}[0-9]" || true; echo "$TAG"; } \
            | sort -uV | grep -B1 -x "$TAG" | head -1 )
          [ "$prev" = "$TAG" ] && prev=""
          echo "previous tag: ${prev:-none}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: server ${{ needs.server-release-test.outputs.version }}
          # releases/latest is the launcher's stable APK URL (provisioning QR) - a server
          # release must never take it over.
          makeLatest: "false"
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.prev.outputs.tag }}
          artifacts: "kid-phone-server-aarch64-unknown-linux-musl.tar.gz,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.sha256,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.minisig,kid-phone-server-x86_64-unknown-linux-musl.tar.gz,kid-phone-server-x86_64-unknown-linux-musl.tar.gz.sha256,kid-phone-server-x86_64-unknown-linux-musl.tar.gz.minisig,update.sh,update.sh.minisig,update-image.sh,update-image.sh.minisig,handy-server-image.txt,handy-server-image.txt.minisig"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
