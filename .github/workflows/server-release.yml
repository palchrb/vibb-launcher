name: Server release

# For a tag server-vX.Y.Z on a commit that is on master/main:
# 1. server-release-test: the tag checks, then fmt + tests, once. server-release-build, a matrix: the
#    static musl binary built natively on a runner of its own architecture (aarch64-unknown-linux-musl
#    on ubuntu-24.04-arm, x86_64-unknown-linux-musl on ubuntu-24.04; plain cargo, no cross, no QEMU)
#    and packed as kid-phone-server-<target>.tar.gz (the binary and static/ at the top) with its
#    .sha256: a tarball for each, so the server runs without Docker on either.
# 2. server-release-sign, in the protected "release" environment (its deployment rule must allow
#    server-v* tags; the SERVER_MINISIGN_KEY secret lives there, not in the repo): signs both
#    tarballs and update.sh with minisign (security review M5; the trusted comment is "<file> <tag>")
#    and checks the signatures against the public key pinned in server/deploy/update.sh. No secret,
#    or no pinned key: the run stops here, before any image is pushed or tagged (server/DEPLOY.md,
#    "Release signing").
# 3. server-release-image (design 22 §6), a matrix: each architecture on a runner of its own
#    (linux/amd64 on ubuntu-24.04, linux/arm64 on ubuntu-24.04-arm; no QEMU), its single-arch image
#    built from that architecture's tarball, pushed by digest only and smoke-tested there natively
#    (server/deploy/image-smoke.sh).
#    server-release-image-merge then joins the two digests into the multi-arch image
#    ghcr.io/<owner>/handy-server, tagged X.Y.Z (and latest, if X.Y.Z is the highest server-v* tag -
#    a patch on an older line doesn't take it), with a build provenance attestation.
# 4. server-release-publish, last: the GitHub release with both tarballs, their .sha256, update.sh
#    and their signatures, as signed in step 2. server/deploy/install.sh
#    and update.sh (and the in-app update check) look up the newest server-v* release through the
#    GitHub API - never releases/latest, which in this monorepo belongs to the launcher: a server
#    release is published with makeLatest false. Publishing last means the update check can't
#    announce a version whose image is missing or broken.
#
# workflow_dispatch is always a dry run (on a branch or a tag ref): the same tests and both tarballs,
# each image built from its tarball and smoke-tested locally on its architecture's own runner, nothing
# signed, pushed, tagged or published. Only a tag push releases.
#
# The GHCR package must be public (design 22, U3): after the first image push, the owner sets its
# visibility once (GitHub > Packages > handy-server > Package settings > Change visibility).
#
# test and build (read-only token, run cargo) are kept apart from the jobs that write (packages,
# contents). Third-party actions are pinned by commit SHA. Never add a pull_request_target
# trigger.

on:
  push:
    tags: [ "server-v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-release-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse tags whose commit is not on master/main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Fetch whichever of the two exists (a fetch naming a missing branch fails as a whole).
          for b in main master; do
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null || true
          done
          for branch in master main; do
            if git rev-parse --verify -q "origin/$branch" >/dev/null &&
               git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on $branch"
              exit 0
            fi
          done
          echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master or main" >&2
          exit 1

      - name: Verify Cargo.toml version matches the tag
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$IS_TAG" = true ]; then
            tag="$GITHUB_REF_NAME"
            if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '$tag' is not server-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [ "server-v$cargo_version" != "$tag" ]; then
              echo "Cargo.toml version ($cargo_version) doesn't match tag ($tag)" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          # The image's latest tag goes only to the highest server release (fetch-depth 0 brings
          # every tag, this one included).
          highest="$(git tag -l 'server-v*' | sed -n -E 's/^server-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V | tail -n 1)"
          if [ "$highest" = "$cargo_version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$cargo_version is not the highest server release ($highest): the image keeps latest where it is"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt

      # The same gate as server-ci.yml, on exactly the tagged commit: nothing is built or published
      # from a commit whose tests fail (clippy stays advisory there, so it isn't repeated here).
      - name: Test
        run: |
          cargo fmt --check
          cargo test --locked

  # One leg per architecture, each on a runner of that architecture: a plain cargo build of the
  # static musl binary (no cross, no QEMU). Each leg hands on one artifact, server-tarball-<target>:
  # the tarball (the binary and static/ at the top, as before) and its .sha256. The sign job signs
  # both, and each image leg builds from its own architecture's tarball.
  server-release-build:
    needs: server-release-test
    strategy:
      # Both verdicts in a dry run; a release needs both legs anyway (server-release-sign).
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    name: server-release-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      # musl-gcc compiles the C in ring and the bundled SQLite against musl's headers. cc-rs would
      # look for aarch64-linux-musl-gcc on the arm runner, which Ubuntu doesn't ship, so CC_<target>
      # names musl-gcc on both.
      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Build
        run: |
          set -euo pipefail
          export "CC_${TARGET//-/_}=musl-gcc"
          cargo build --release --locked --target "$TARGET"

      # The tarball must run on any Linux of its architecture: a static binary (no interpreter, no
      # shared libraries) for the right machine.
      - name: Check the binary is static and for its architecture
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/kid_phone_server"
          case "$TARGET" in
            aarch64-*) machine="AArch64" ;;
            x86_64-*) machine="Advanced Micro Devices X86-64" ;;
            *) echo "unknown target $TARGET" >&2; exit 1 ;;
          esac
          header="$(readelf -h "$bin")"
          grep -q "Machine: *$machine$" <<<"$header" || { echo "$header"; echo "$bin isn't $machine" >&2; exit 1; }
          linking="$(readelf -l -d "$bin")"
          if grep -qE 'INTERP|\(NEEDED\)' <<<"$linking"; then
            echo "$linking"
            echo "$bin is dynamically linked" >&2
            exit 1
          fi
          file "$bin"
          # It runs here, natively: the usage text, exit status 2.
          status=0
          "$bin" no-such-command 2>/dev/null || status=$?
          [ "$status" = 2 ] || { echo "$bin no-such-command exited $status, not 2" >&2; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          # Laid out as before: the binary and static/ at the top.
          mkdir -p tarball
          cp "target/$TARGET/release/kid_phone_server" tarball/
          cp -r static tarball/
          tar -czf "kid-phone-server-$TARGET.tar.gz" -C tarball .
          # install.sh/update.sh download this and refuse a tarball that doesn't match it.
          sha256sum "kid-phone-server-$TARGET.tar.gz" > "kid-phone-server-$TARGET.tar.gz.sha256"

      - name: Upload the tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-tarball-${{ matrix.target }}
          path: |
            server/kid-phone-server-${{ matrix.target }}.tar.gz
            server/kid-phone-server-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Root on every Pi installs and runs only what this key signed (install.sh, update.sh and
  # actions.sh check it). Nothing from the checkout is executed here; only this job sees the key.
  server-release-sign:
    needs: [ server-release-test, server-release-build ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Both legs' artifacts (server-tarball-<target>) into one directory.
      - name: Download the tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-tarball-*
          merge-multiple: true
          path: signed

      - name: Sign both tarballs and update.sh
        env:
          SIGNING_KEY: ${{ secrets.SERVER_MINISIGN_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "The SERVER_MINISIGN_KEY secret is missing from the 'release' environment: no server release goes out unsigned (server/DEPLOY.md, Release signing)." >&2
            exit 1
          fi
          pubkey="$(sed -n 's/^SERVER_SIGNING_PUBKEY="\(.*\)"$/\1/p' server/deploy/update.sh | head -n 1)"
          if [ -z "$pubkey" ] || [ "$pubkey" = "not-set" ]; then
            echo "No public key is pinned in server/deploy/update.sh (SERVER_SIGNING_PUBKEY)." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          key="$RUNNER_TEMP/server-minisign.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          cp server/deploy/update.sh signed/update.sh
          cd signed
          # Both tarballs, each matching its .sha256, before anything is signed.
          for target in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            sha256sum -c "kid-phone-server-$target.tar.gz.sha256"
          done
          for file in kid-phone-server-aarch64-unknown-linux-musl.tar.gz kid-phone-server-x86_64-unknown-linux-musl.tar.gz update.sh; do
            minisign -S -s "$key" -m "$file" -t "$file $TAG"
            # The secret must match the pinned key, or every Pi would refuse the release.
            comment="$(minisign -V -Q -P "$pubkey" -m "$file")"
            [ "$comment" = "$file $TAG" ] || { echo "$file: the signature doesn't verify with the pinned key" >&2; exit 1; }
          done
          rm -f "$key"

      - name: Upload the signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-release-signed
          path: signed
          if-no-files-found: error
          retention-days: 7

  # One leg per architecture, each on a runner of that architecture: the build and the smoke test
  # run natively (no QEMU), from the binary in that architecture's tarball (server-release-build's
  # leg for it). Each leg hands its smoke-tested digest to the merge as an artifact of its own
  # (server-image-digest-<arch>, one file digest-<arch>), not as a job output: a matrix's legs share
  # the job's outputs.
  server-release-image:
    needs: [ server-release-test, server-release-build, server-release-sign ]
    # A release only once its files are signed; a workflow_dispatch (no signing) is the dry run.
    if: ${{ !cancelled() && needs.server-release-test.result == 'success' && needs.server-release-build.result == 'success' && (needs.server-release-sign.result == 'success' || github.event_name != 'push') }}
    strategy:
      # Both verdicts in a dry run; a release needs both legs anyway (server-release-image-merge).
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: server-release-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.server-release-test.outputs.version }}
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download this architecture's tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-tarball-${{ matrix.target }}
          path: ${{ runner.temp }}/tarball

      # The image's build context (server/Dockerfile): dist/<arch>/kid_phone_server and dist/static,
      # unpacked from the tarball the release publishes (tar keeps the executable bit).
      - name: Stage the image context
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/tarball"
          (cd "$tarball" && sha256sum -c "kid-phone-server-$TARGET.tar.gz.sha256")
          mkdir "$tarball/unpacked"
          tar -xzf "$tarball/kid-phone-server-$TARGET.tar.gz" -C "$tarball/unpacked"
          mkdir -p "dist/$ARCH"
          install -m 755 "$tarball/unpacked/kid_phone_server" "dist/$ARCH/kid_phone_server"
          cp -r "$tarball/unpacked/static" dist/static

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server" >> "$GITHUB_OUTPUT"

      # This architecture's image, pushed by digest only: nothing carries X.Y.Z or latest until both
      # legs passed their smoke tests.
      - name: Build and push by digest
        id: push
        if: ${{ env.RELEASE == 'true' }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [[ "$digest" == sha256:* ]] || { echo "no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the pushed image (natively)
        if: ${{ env.RELEASE == 'true' }}
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform "linux/$ARCH" "$REF"
          deploy/image-smoke.sh "$REF" "linux/$ARCH"

      # Only a digest that passed its smoke test reaches the merge.
      - name: Write the digest
        if: ${{ env.RELEASE == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/digest-$ARCH"

      - name: Upload the digest
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Dry run - build and smoke test locally (natively)
        if: ${{ env.RELEASE != 'true' }}
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" --load \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t "handy-server:dry-$ARCH" .
          deploy/image-smoke.sh "handy-server:dry-$ARCH" "linux/$ARCH"

  # Joins the two smoke-tested digests into the multi-arch image, then tags it. A tag run only: a dry
  # run pushed nothing.
  server-release-image-merge:
    needs: [ server-release-test, server-release-build, server-release-sign, server-release-image ]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') && needs.server-release-test.result == 'success' && needs.server-release-build.result == 'success' && needs.server-release-sign.result == 'success' && needs.server-release-image.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.server-release-test.outputs.version }}
      LATEST: ${{ needs.server-release-test.outputs.latest }}
    steps:
      - name: Download the amd64 digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-digest-amd64
          path: ${{ runner.temp }}/digests

      - name: Download the arm64 digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-digest-arm64
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server" >> "$GITHUB_OUTPUT"

      - name: Tag X.Y.Z (and latest, for the highest release)
        id: merge
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/digests/digest-$arch"
            [ -f "$file" ] || { echo "no digest file from the $arch leg" >&2; exit 1; }
            digest="$(head -n 1 "$file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the $arch leg's digest isn't sha256: '$digest'" >&2; exit 1; }
            sources+=("$IMAGE@$digest")
          done
          # The index must name exactly the two tested platforms before any tag goes on it.
          platforms="$(docker buildx imagetools create --dry-run "${sources[@]}" \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort | paste -sd ' ')"
          [ "$platforms" = "linux/amd64 linux/arm64" ] || { echo "the index would carry: '$platforms'" >&2; exit 1; }
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = true ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # The index's digest, for the attestation.
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$digest" == sha256:* ]] || { echo "no index digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  server-release-publish:
    needs: [ server-release-test, server-release-build, server-release-sign, server-release-image, server-release-image-merge ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-release-signed

      - name: Find this component's previous tag (the release notes compare with it)
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # launcher-v / music-v / server-v: GitHub's default compares with the newest tag of any kind.
          prefix="${TAG%%-v*}-v"
          prev=$( { gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' | grep "^${prefix}[0-9]" || true; echo "$TAG"; } \
            | sort -uV | grep -B1 -x "$TAG" | head -1 )
          [ "$prev" = "$TAG" ] && prev=""
          echo "previous tag: ${prev:-none}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: server ${{ needs.server-release-test.outputs.version }}
          # releases/latest is the launcher's stable APK URL (provisioning QR) - a server
          # release must never take it over.
          makeLatest: "false"
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.prev.outputs.tag }}
          artifacts: "kid-phone-server-aarch64-unknown-linux-musl.tar.gz,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.sha256,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.minisig,kid-phone-server-x86_64-unknown-linux-musl.tar.gz,kid-phone-server-x86_64-unknown-linux-musl.tar.gz.sha256,kid-phone-server-x86_64-unknown-linux-musl.tar.gz.minisig,update.sh,update.sh.minisig"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
