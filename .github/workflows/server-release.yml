name: Server release

# For a tag server-vX.Y.Z on a commit that is on master/main:
# 1. server-release-build: fmt + tests, then static musl binaries for aarch64 (the Pi Zero 2 W
#    tarball, as before) and x86_64 (the image).
# 2. server-release-sign, in the protected "release" environment (its deployment rule must allow
#    server-v* tags; the SERVER_MINISIGN_KEY secret lives there, not in the repo): signs the tarball
#    and update.sh with minisign (security review M5; the trusted comment is "<file> <tag>") and
#    checks the signatures against the public key pinned in server/deploy/update.sh. No secret, or
#    no pinned key: the run stops here, before any image is pushed or tagged (server/DEPLOY.md,
#    "Release signing").
# 3. server-release-image (design 22 §6): a multi-arch image ghcr.io/<owner>/handy-server, pushed
#    by digest only, smoke-tested on amd64 natively and on arm64 under QEMU
#    (server/deploy/image-smoke.sh), only then tagged X.Y.Z (and latest, if X.Y.Z is the highest
#    server-v* tag - a patch on an older line doesn't take it), with a build provenance attestation.
# 4. server-release-publish, last: the GitHub release with the tarball, update.sh and their
#    signatures, as signed in step 2. server/deploy/install.sh
#    and update.sh (and the in-app update check) look up the newest server-v* release through the
#    GitHub API - never releases/latest, which in this monorepo belongs to the launcher: a server
#    release is published with makeLatest false. Publishing last means the update check can't
#    announce a version whose image is missing or broken.
#
# workflow_dispatch is always a dry run (on a branch or a tag ref): the same build, the image built and
# smoke-tested on both platforms locally, nothing pushed, tagged or published. Only a tag push
# releases.
#
# The GHCR package must be public (design 22, U3): after the first image push, the owner sets its
# visibility once (GitHub > Packages > handy-server > Package settings > Change visibility).
#
# build (read-only token, runs cargo/cross) is kept apart from the jobs that write (packages,
# contents). Third-party actions are pinned by commit SHA. Never add a pull_request_target
# trigger.

on:
  push:
    tags: [ "server-v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-release-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse tags whose commit is not on master/main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Fetch whichever of the two exists (a fetch naming a missing branch fails as a whole).
          for b in main master; do
            git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null || true
          done
          for branch in master main; do
            if git rev-parse --verify -q "origin/$branch" >/dev/null &&
               git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on $branch"
              exit 0
            fi
          done
          echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master or main" >&2
          exit 1

      - name: Verify Cargo.toml version matches the tag
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$IS_TAG" = true ]; then
            tag="$GITHUB_REF_NAME"
            if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag '$tag' is not server-vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [ "server-v$cargo_version" != "$tag" ]; then
              echo "Cargo.toml version ($cargo_version) doesn't match tag ($tag)" >&2
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          # The image's latest tag goes only to the highest server release (fetch-depth 0 brings
          # every tag, this one included).
          highest="$(git tag -l 'server-v*' | sed -n -E 's/^server-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V | tail -n 1)"
          if [ "$highest" = "$cargo_version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$cargo_version is not the highest server release ($highest): the image keeps latest where it is"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned (security review L9); move it on deliberately, with the clippy count.
          toolchain: 1.99.0
          components: rustfmt

      # The same gate as server-ci.yml, on exactly the tagged commit: nothing is published from a
      # commit whose tests fail (clippy stays advisory there, so it isn't repeated here).
      - name: Test
        run: |
          cargo fmt --check
          cargo test --locked

      - name: Install cross
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross@0.2.5

      - name: Build (aarch64-unknown-linux-musl)
        run: cross build --release --locked --target aarch64-unknown-linux-musl

      - name: Build (x86_64-unknown-linux-musl)
        run: cross build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          set -euo pipefail
          # The Pi's tarball, laid out as before: the binary and static/ at the top.
          mkdir -p tarball
          cp target/aarch64-unknown-linux-musl/release/kid_phone_server tarball/
          cp -r static tarball/
          tar -czf kid-phone-server-aarch64-unknown-linux-musl.tar.gz -C tarball .
          # install.sh/update.sh download this and refuse a tarball that doesn't match it.
          sha256sum kid-phone-server-aarch64-unknown-linux-musl.tar.gz \
            > kid-phone-server-aarch64-unknown-linux-musl.tar.gz.sha256
          # The image's build context (server/Dockerfile).
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/kid_phone_server dist/amd64/
          cp target/aarch64-unknown-linux-musl/release/kid_phone_server dist/arm64/
          cp -r static dist/static

      - name: Upload tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-release
          path: |
            server/kid-phone-server-aarch64-unknown-linux-musl.tar.gz
            server/kid-phone-server-aarch64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload the image context
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-image-context
          path: server/dist
          if-no-files-found: error
          retention-days: 7

  # Root on every Pi installs and runs only what this key signed (install.sh, update.sh and
  # actions.sh check it). Nothing from the checkout is executed here; only this job sees the key.
  server-release-sign:
    needs: server-release-build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-release
          path: signed

      - name: Sign the tarball and update.sh
        env:
          SIGNING_KEY: ${{ secrets.SERVER_MINISIGN_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "The SERVER_MINISIGN_KEY secret is missing from the 'release' environment: no server release goes out unsigned (server/DEPLOY.md, Release signing)." >&2
            exit 1
          fi
          pubkey="$(sed -n 's/^SERVER_SIGNING_PUBKEY="\(.*\)"$/\1/p' server/deploy/update.sh | head -n 1)"
          if [ -z "$pubkey" ] || [ "$pubkey" = "not-set" ]; then
            echo "No public key is pinned in server/deploy/update.sh (SERVER_SIGNING_PUBKEY)." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          key="$RUNNER_TEMP/server-minisign.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          cp server/deploy/update.sh signed/update.sh
          cd signed
          for file in kid-phone-server-aarch64-unknown-linux-musl.tar.gz update.sh; do
            minisign -S -s "$key" -m "$file" -t "$file $TAG"
            # The secret must match the pinned key, or every Pi would refuse the release.
            comment="$(minisign -V -Q -P "$pubkey" -m "$file")"
            [ "$comment" = "$file $TAG" ] || { echo "$file: the signature doesn't verify with the pinned key" >&2; exit 1; }
          done
          rm -f "$key"

      - name: Upload the signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-release-signed
          path: signed
          if-no-files-found: error
          retention-days: 7

  server-release-image:
    needs: [ server-release-build, server-release-sign ]
    # A release only once its files are signed; a workflow_dispatch (no signing) is the dry run.
    if: ${{ !cancelled() && needs.server-release-build.result == 'success' && (needs.server-release-sign.result == 'success' || github.event_name != 'push') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.server-release-build.outputs.version }}
      LATEST: ${{ needs.server-release-build.outputs.latest }}
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the image context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-image-context
          path: server/dist

      # Artifacts don't keep the executable bit.
      - name: Make the binaries executable
        run: chmod 755 dist/amd64/kid_phone_server dist/arm64/kid_phone_server

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/handy-server" >> "$GITHUB_OUTPUT"

      # Pushed by digest only: nothing carries X.Y.Z or latest until the smoke tests passed.
      - name: Build and push by digest
        id: push
        if: ${{ env.RELEASE == 'true' }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [[ "$digest" == sha256:* ]] || { echo "no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the pushed image (amd64 natively, arm64 under QEMU)
        if: ${{ env.RELEASE == 'true' }}
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            # The same digest again for the second platform: newer Docker refuses to pull it over
            # the first one ("cannot overwrite digest", server-v0.24.0's run), so drop it first.
            docker image rm -f "$REF" >/dev/null 2>&1 || true
            docker pull --platform "$platform" "$REF"
            deploy/image-smoke.sh "$REF" "$platform"
          done

      - name: Dry run - build and smoke test locally (amd64 natively, arm64 under QEMU)
        if: ${{ env.RELEASE != 'true' }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
              -t "handy-server:dry-$arch" .
            deploy/image-smoke.sh "handy-server:dry-$arch" "linux/$arch"
          done

      - name: Tag X.Y.Z (and latest, for the highest release)
        if: ${{ env.RELEASE == 'true' }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = true ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

      - name: Attest build provenance
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  server-release-publish:
    needs: [ server-release-build, server-release-sign, server-release-image ]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-release-signed

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: server ${{ needs.server-release-build.outputs.version }}
          # releases/latest is the launcher's stable APK URL (provisioning QR) - a server
          # release must never take it over.
          makeLatest: "false"
          generateReleaseNotes: true
          artifacts: "kid-phone-server-aarch64-unknown-linux-musl.tar.gz,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.sha256,kid-phone-server-aarch64-unknown-linux-musl.tar.gz.minisig,update.sh,update.sh.minisig"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
