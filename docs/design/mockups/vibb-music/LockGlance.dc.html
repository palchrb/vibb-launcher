<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Låseskjermens første side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<!-- Design 25 (docs/design/25-lock-glance.md): three 320x568 screens of the same lock.
     A: the glance page while music plays - the compact tile, one Element X row (sender only) and one missed call.
     B: the glance page without music - three rows and the "more" line.
     C: the keypad stage after a row was tapped on A or B (tap a row there: C's prompt follows). -->
<div style="width: 1008px; height: 568px; display: flex; gap: 24px; align-items: flex-start">

  <!-- A: glance with music -->
  <div style="width: 320px; height: 568px; flex: none; box-sizing: border-box; background: #0C0C14; color: #FBE4DC; font-family: 'Nunito', system-ui, sans-serif; position: relative; overflow: hidden">
    <div style="height: 100%; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 56px; font-weight: 800; color: #FFFFFF; line-height: 1">14:32</div>
      <div style="margin-top: 6px; font-size: 14px; font-weight: 700; color: rgba(251,228,220,0.78)">søndag 11. oktober</div>

      <div style="margin-top: 18px; width: 100%; box-sizing: border-box; background: #1B1B28; border-radius: 20px; padding: 10px; display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(160deg, #C2683F, #3A1F2B); display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FBE4DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"></path><path d="M8 7h7M8 11h5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 800; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kapittel 3: Månen</span>
          <span style="font-size: 13px; font-weight: 700; color: rgba(251,228,220,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reven og månen</span>
          <span style="margin-top: 6px; height: 3px; border-radius: 2px; background: #2A2A3A; overflow: hidden; display: block">
            <span style="display: block; width: 42%; height: 3px; background: #F0A884"></span>
          </span>
        </span>
        <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="all: unset; cursor: pointer; width: 48px; height: 48px; flex: none; border-radius: 50%; background: #F0A884; color: #0C0C14; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></sc-if>
        </button>
      </div>

      <div style="margin-top: 14px; width: 100%; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{rowsA}}" as="r" hint-placeholder-count="2">
          <button type="button" onClick="{{r.open}}" aria-label="{{r.aria}}" style="all: unset; cursor: pointer; width: 100%; min-height: 56px; box-sizing: border-box; background: #1B1B28; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
            <sc-if value="{{r.isApp}}" hint-placeholder-val="{{ true }}">
              <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #0DBD8B; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6 4h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"></path></svg>
              </span>
            </sc-if>
            <sc-if value="{{r.isCall}}" hint-placeholder-val="{{ false }}">
              <span style="width: 36px; height: 36px; flex: none; position: relative">
                <span style="width: 36px; height: 36px; border-radius: 50%; background: {{r.avatar}}; color: #0C0C14; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{r.initial}}</span>
                <span style="position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: #E03131; border: 2px solid #1B1B28; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"></path></svg>
                </span>
              </span>
            </sc-if>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 800; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
              <span style="font-size: 13px; font-weight: 700; color: rgba(251,228,220,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
            </span>
            <span style="flex: none; align-self: flex-start; margin-top: 2px; font-size: 12px; font-weight: 700; color: rgba(251,228,220,0.78)">{{r.time}}</span>
          </button>
        </sc-for>
      </div>

      <div style="flex: 1"></div>

      <button type="button" onClick="{{toKeypad}}" style="all: unset; cursor: pointer; width: 100%; height: 56px; flex: none; border-radius: 20px; background: #F0A884; color: #0C0C14; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.8-1.2"></path></svg>
        Lås opp
      </button>
      <button type="button" style="all: unset; cursor: pointer; margin-top: 6px; height: 44px; flex: none; padding: 0 18px; border-radius: 22px; color: #FF8A8A; display: flex; align-items: center; font-size: 15px; font-weight: 800">Nødsamtale</button>
    </div>
  </div>

  <!-- B: glance without music -->
  <div style="width: 320px; height: 568px; flex: none; box-sizing: border-box; background: #0C0C14; color: #FBE4DC; font-family: 'Nunito', system-ui, sans-serif; position: relative; overflow: hidden">
    <div style="height: 100%; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 56px; font-weight: 800; color: #FFFFFF; line-height: 1">14:32</div>
      <div style="margin-top: 6px; font-size: 14px; font-weight: 700; color: rgba(251,228,220,0.78)">søndag 11. oktober</div>

      <div style="margin-top: 22px; width: 100%; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{rowsB}}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{r.open}}" aria-label="{{r.aria}}" style="all: unset; cursor: pointer; width: 100%; min-height: 56px; box-sizing: border-box; background: #1B1B28; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
            <sc-if value="{{r.isApp}}" hint-placeholder-val="{{ true }}">
              <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #0DBD8B; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6 4h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"></path></svg>
              </span>
            </sc-if>
            <sc-if value="{{r.isCall}}" hint-placeholder-val="{{ false }}">
              <span style="width: 36px; height: 36px; flex: none; position: relative">
                <span style="width: 36px; height: 36px; border-radius: 50%; background: {{r.avatar}}; color: #0C0C14; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{r.initial}}</span>
                <span style="position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: #E03131; border: 2px solid #1B1B28; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"></path></svg>
                </span>
              </span>
            </sc-if>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 800; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
              <span style="font-size: 13px; font-weight: 700; color: rgba(251,228,220,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
            </span>
            <span style="flex: none; align-self: flex-start; margin-top: 2px; font-size: 12px; font-weight: 700; color: rgba(251,228,220,0.78)">{{r.time}}</span>
          </button>
        </sc-for>
        <div style="height: 24px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: rgba(251,228,220,0.78)">+ 1 varsel til</div>
      </div>

      <div style="flex: 1"></div>

      <button type="button" onClick="{{toKeypad}}" style="all: unset; cursor: pointer; width: 100%; height: 56px; flex: none; border-radius: 20px; background: #F0A884; color: #0C0C14; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.8-1.2"></path></svg>
        Lås opp
      </button>
      <button type="button" style="all: unset; cursor: pointer; margin-top: 6px; height: 44px; flex: none; padding: 0 18px; border-radius: 22px; color: #FF8A8A; display: flex; align-items: center; font-size: 15px; font-weight: 800">Nødsamtale</button>
    </div>
  </div>

  <!-- C: the keypad stage (no clock or date - the glance page has them) -->
  <div style="width: 320px; height: 568px; flex: none; box-sizing: border-box; background: #0C0C14; color: #FBE4DC; font-family: 'Nunito', system-ui, sans-serif; position: relative; overflow: hidden">
    <div style="height: 100%; box-sizing: border-box; padding: 10px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 100%; display: flex; align-items: center; min-height: 56px">
        <button type="button" aria-label="Tilbake" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; background: #1B1B28; display: flex; align-items: center; justify-content: center; color: #FBE4DC">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div aria-live="polite" style="flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 800; color: #FFFFFF; padding-right: 44px">{{prompt}}</div>
      </div>

      <div style="display: flex; gap: 14px">
        <span style="width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #FBE4DC; box-sizing: border-box"></span>
        <span style="width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #FBE4DC; box-sizing: border-box"></span>
        <span style="width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #FBE4DC; box-sizing: border-box"></span>
        <span style="width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #FBE4DC; box-sizing: border-box"></span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, 60px); gap: 10px 26px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <sc-if value="{{k.isDigit}}" hint-placeholder-val="{{ true }}">
            <button type="button" style="all: unset; cursor: pointer; width: 60px; height: 60px; flex: none; border-radius: 50%; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800">{{k.label}}</button>
          </sc-if>
          <sc-if value="{{k.isDel}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="Slett" style="all: unset; cursor: pointer; width: 60px; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 5M12 9l5 5"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{k.isGap}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
        </sc-for>
      </div>

      <button type="button" style="all: unset; cursor: pointer; margin-top: 2px; height: 44px; flex: none; padding: 0 18px; border-radius: 22px; background: #C92A2A; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"></path></svg>
        Nødsamtale
      </button>
      <button type="button" style="all: unset; cursor: pointer; margin-top: -6px; height: 36px; flex: none; padding: 0 16px; color: rgba(255,255,255,0.75); display: flex; align-items: center; font-size: 13px; font-weight: 700">Foreldrekode</button>

      <div style="margin-top: auto; width: 100%; display: flex; align-items: center; gap: 10px; background: #1B1B28; border-radius: 16px; padding: 6px 8px; box-sizing: border-box">
        <span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: linear-gradient(160deg, #C2683F, #3A1F2B)"></span>
        <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 800; color: rgba(251,228,220,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reven og månen</span>
        <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; flex: none; border-radius: 50%; color: #F0A884; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></sc-if>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1008,"height":568}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, prompt: 'Skriv koden for å åpne Element X' };
  }
  renderVals() {
    const s = this.state;
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
    const prompt = (text) => () => this.setState({ prompt: text });
    const openApp = (app) => prompt('Skriv koden for å åpne ' + app);
    const openMissed = prompt('Skriv koden for å se tapte anrop');
    const element = (title, count, time) => ({
      isApp: true, isCall: false, initial: '', avatar: '', title: title,
      sub: 'Element X · ' + count + (count === 1 ? ' melding' : ' meldinger'), time: time,
      aria: 'Element X, ' + title + ', ' + count + (count === 1 ? ' melding' : ' meldinger') + ', ' + time + '. Lås opp og åpne',
      open: openApp('Element X')
    });
    const missed = (title, initial, avatar, time) => ({
      isApp: false, isCall: true, initial: initial, avatar: avatar, title: title, sub: 'Tapt anrop', time: time,
      aria: 'Tapt anrop fra ' + title + ', ' + time + '. Lås opp og se tapte anrop',
      open: openMissed
    });
    return {
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Spill',
      togglePlay: () => this.setState({ playing: !s.playing }),
      toKeypad: prompt('Skriv inn koden din'),
      prompt: s.prompt,
      rowsA: [element('Pappa', 2, '14:10'), missed('Mamma', 'M', '#F08C3A', '14:02')],
      rowsB: [element('Pappa', 2, '14:10'), missed('Mamma', 'M', '#F08C3A', '14:02'), element('Klassen 5B', 5, '12:30')],
      keys: labels.map((l) => ({ label: l, isDigit: l !== '' && l !== 'del', isDel: l === 'del', isGap: l === '' }))
    };
  }
}
</script>
</body>
</html>
