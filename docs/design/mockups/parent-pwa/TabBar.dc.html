<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 7px 4px 0; background: {{barBg}}; border-top: 0.5px solid {{barLine}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif">
  <a href="Main.dc.html" aria-current="{{cur.devices}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.devices}}; font-size: 12px; font-weight: 500">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="7.5" y="2.5" width="11" height="21" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.3 20h3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Devices</span>
  </a>
  <a href="Apps.dc.html" aria-current="{{cur.apps}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.apps}}; font-size: 12px; font-weight: 500">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3.5" y="3.5" width="8" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14.5" y="3.5" width="8" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="14.5" width="8" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14.5" y="14.5" width="8" height="8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Apps</span>
  </a>
  <a href="Locate.dc.html" aria-current="{{cur.locate}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.locate}}; font-size: 12px; font-weight: 500">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 23s7.5-7 7.5-12.6A7.5 7.5 0 0 0 5.5 10.4C5.5 16 13 23 13 23z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="13" cy="10.5" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Locate</span>
  </a>
  <a href="Music.dc.html" aria-current="{{cur.music}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.music}}; font-size: 12px; font-weight: 500">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M10 19V5.5l11-2.5v13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><ellipse cx="7.2" cy="19.2" rx="3" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="18.2" cy="16.6" rx="3" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Music</span>
  </a>
  <a href="Settings.dc.html" aria-current="{{cur.settings}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.settings}}; font-size: 12px; font-weight: 500">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 2.8v2.6M13 20.6v2.6M2.8 13h2.6M20.6 13h2.6M5.8 5.8l1.8 1.8M18.4 18.4l1.8 1.8M5.8 20.2l1.8-1.8M18.4 7.6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="13" r="7.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Settings</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["devices","apps","locate","music","settings"],"default":"devices"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'devices';
    const dark = this.props.dark === true || this.props.dark === 'true';
    const on = dark ? '#4A9BFF' : '#0B66D6';
    const off = dark ? '#98989F' : '#6B6B70';
    const keys = ['devices', 'apps', 'locate', 'music', 'settings'];
    const c = {};
    const cur = {};
    for (const k of keys) {
      c[k] = k === active ? on : off;
      cur[k] = k === active ? 'page' : 'false';
    }
    return {
      c,
      cur,
      barBg: dark ? 'rgba(22,22,24,0.94)' : 'rgba(249,249,250,0.94)',
      barLine: dark ? '#38383A' : '#C6C6C8',
    };
  }
}
</script>
</body>
</html>
