<style>
body{margin:0}
.scr{width:390px;box-sizing:border-box;background:#F2F2F7;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
a{color:#0B66D6;text-decoration:none}a:hover{color:#084C9E}
.lt{font-size:34px;font-weight:700;margin:48px 16px 10px;line-height:1.15}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:#E3E3E8;border-radius:9px;padding:2px;margin:0 16px}
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border-radius:7px;font-size:15px;font-weight:600;color:#000}
.seg a.on{background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.map{position:relative;height:300px;margin:14px 16px 0;border-radius:14px;overflow:hidden;background:#E8EEE4}
.card{background:#FFFFFF;border-radius:12px;margin:12px 16px 0;padding:14px 16px}
.place{font-size:20px;font-weight:700}
.s2{font-size:14px;color:#6B6B70;margin-top:3px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 16px 0}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;border-radius:14px;background:#FFFFFF;color:#0B66D6;font-size:14px;font-weight:600;border:none;font-family:inherit;cursor:pointer}
.ab.danger{color:#D70015}
.sh{font-size:13px;color:#6B6B70;text-transform:uppercase;letter-spacing:.4px;margin:22px 32px 7px}
.grp{background:#FFFFFF;border-radius:12px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;box-sizing:border-box;position:relative;color:#000;font-size:17px}
.row+.row:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid #D1D1D6}
.val{color:#6B6B70;font-size:16px}
.tabwrap{position:absolute;left:0;right:0;bottom:0}
</style>
</helmet>

      <circle cx="176" cy="148" r="11" fill="#FFFFFF"/>
      <circle cx="176" cy="148" r="8" fill="#5E5CE6"/>
    </svg>
  </div>

  <div class="card">
    <div class="place">Rosenhoff skole</div>
    <div class="s2">Within 40 m · 10 min ago</div>
  </div>

  <div class="acts">
    <button class="ab" type="button">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="3" fill="currentColor"/><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 1.5v3M11 17.5v3M1.5 11h3M17.5 11h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Update
    </button>
    <button class="ab" type="button">

      Lock
    </button>
  </div>

  <div class="sh">Recent</div>
  <div class="grp">
    <div class="row"><span style="flex: 1">Located</span><span class="val">10:49 · done</span></div>
    <div class="row"><span style="flex: 1">Ring</span><span class="val">Yesterday · done</span></div>
  </div>

  <div class="tabwrap">
    <dc-import name="TabBar" active="locate" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
