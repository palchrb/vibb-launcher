<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>34 PIN keypad after</title>
<link rel="stylesheet" href="kit.css">
<style>
.top { display: flex; align-items: center; padding: 8px 14px 0; height: 60px; }
.prompt { flex: 1; text-align: center; font-size: 17px; font-weight: 800; color: var(--core); margin-right: 44px; }
.dots { display: flex; justify-content: center; gap: 16px; margin: 14px 0 18px; }
.dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--core-dim); }
.dots i.f { background: var(--core); border-color: var(--core); }
.pad { display: grid; grid-template-columns: repeat(3, 72px); justify-content: center; column-gap: 26px; row-gap: 12px; }
.k { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: var(--core);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.k.blank { background: none; box-shadow: none; }
.k .g { width: 28px; height: 28px; }
.foot { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.em { height: 48px; padding: 0 22px; border-radius: 24px; background: var(--emergency-tonal); color: var(--emergency-text); display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
.em .g { width: 20px; height: 20px; }
.parent { height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--core-dim); }
</style></head>
<body>
<div class="phone" data-time="16:42">
  <div class="top"><span class="back"><i data-g="kid_back"></i></span><span class="prompt">Skriv inn koden din</span></div>
  <div class="dots"><i class="f"></i><i class="f"></i><i></i><i></i></div>
  <div class="pad">
    <div class="k">1</div><div class="k">2</div><div class="k">3</div>
    <div class="k">4</div><div class="k">5</div><div class="k">6</div>
    <div class="k">7</div><div class="k">8</div><div class="k">9</div>
    <div class="k blank"></div><div class="k">0</div><div class="k blank"><i data-g="pin_backspace"></i></div>
  </div>
  <div class="foot">
    <div class="em"><i data-g="kid_phone"></i>Nødsamtale</div>
    <div class="parent">Foreldrekode</div>
  </div>
</div>
<script src="glyphs.js"></script><script src="kit.js"></script>
</body></html>
