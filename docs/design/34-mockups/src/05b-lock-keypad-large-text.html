<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>34 PIN keypad after, font scale 2.0</title>
<link rel="stylesheet" href="kit.css">
<style>
/* One column, nothing overlaid: header, dots, the keypad (takes the rest), a 16 dp gap, the emergency button
   (>= 48 dp, grows with the text), Foreldrekode (44 dp), 20 dp above the gesture bar. The keys are sized from the
   keypad's measured height (as PinKeypadLayout does): min(72, (h - 3 x gap) / 4), floor 32. --fs = font scale. */
.phone { display: flex; flex-direction: column; --fs: 1; }
.top { display: flex; align-items: center; padding: 8px 14px 0; min-height: 60px; flex: none; }
.prompt { flex: 1; text-align: center; font-size: calc(17px * var(--fs)); font-weight: 800; color: var(--core); margin-right: 44px; }
.dots { display: flex; justify-content: center; gap: 16px; margin: 10px 0 12px; flex: none; }
.dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--core-dim); }
.dots i.f { background: var(--core); border-color: var(--core); }
.padbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.pad { display: grid; grid-template-columns: repeat(3, var(--k)); grid-auto-rows: var(--k); column-gap: 26px; row-gap: var(--gap); }
.k { width: var(--k); height: var(--k); border-radius: 50%; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--k) * .42); font-weight: 700; color: var(--core); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.k.blank { background: none; box-shadow: none; }
.k .g { width: 28px; height: 28px; }
.foot { flex: none; display: flex; flex-direction: column; align-items: center; padding: 16px 0 20px; }
.em { min-height: 48px; padding: 8px 22px; border-radius: 24px; background: var(--emergency-tonal); color: var(--emergency-text); display: flex; align-items: center; gap: 8px;
  font-size: calc(16px * var(--fs)); font-weight: 800; }
.em .g { width: 20px; height: 20px; }
.parent { min-height: 44px; display: flex; align-items: center; font-size: calc(14px * var(--fs)); font-weight: 700; color: var(--core-dim); }
</style></head>
<body data-fs="2.0">
<div class="phone" data-time="16:42">
  <div class="top"><span class="back"><i data-g="kid_back"></i></span><span class="prompt">Skriv inn koden din</span></div>
  <div class="dots"><i class="f"></i><i class="f"></i><i></i><i></i></div>
  <div class="padbox">
    <div class="pad">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div>
      <div class="k blank"></div><div class="k">0</div><div class="k blank"><i data-g="pin_backspace"></i></div>
    </div>
  </div>
  <div class="foot">
    <div class="em"><i data-g="kid_phone"></i>Nødsamtale</div>
    <div class="parent">Foreldrekode</div>
  </div>
</div>
<script src="glyphs.js"></script><script src="kit.js"></script>
<script>
// The font scale from the file name's "-fs130" (05b renders the same page at 1.3).
const fs = (location.search.match(/fs=([\d.]+)/) || [, document.body.dataset.fs || 1])[1];
const ph = document.querySelector('.phone');
ph.style.setProperty('--fs', fs);
ph.style.setProperty('--gap', '10px');
ph.style.setProperty('--k', '10px');
window.fit = document.fonts.ready.then(() => {
  const h = document.querySelector('.padbox').getBoundingClientRect().height;
  const k = Math.max(32, Math.min(72, Math.floor((h - 3 * 10) / 4)));
  ph.style.setProperty('--k', k + 'px');
});
</script>
</body></html>
