.np { position: absolute; left: 12px; right: 12px; bottom: 22px; height: 56px; border-radius: 18px; background: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 8px; box-shadow: 0 -4px 14px rgba(0,0,0,.35); }
