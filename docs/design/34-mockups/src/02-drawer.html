<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><title>34 Drawer after</title>
<link rel="stylesheet" href="kit.css">
<style>
.head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
.head .t { font-size: 22px; font-weight: 800; }
.round { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; color: var(--ink-dim); }
.round .g { width: 20px; height: 20px; }
.list { margin: 6px 16px 0; background: var(--card); border-radius: 18px; overflow: hidden; }
.row { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; border-top: 1px solid var(--hair); }
.row:first-child { border-top: 0; }
.dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.dot .g { width: 17px; height: 17px; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(180deg, rgba(12,12,20,0), var(--ground) 70%); }
</style></head>
<body>
<div class="phone" data-time="16:42">
  <div class="head"><span class="round"><i data-g="kid_settings"></i></span><span class="t">Alle apper</span><span class="round" style="font-size:20px;font-weight:800">✕</span></div>
  <div class="list">
    <div class="row">Chrome</div>
    <div class="row">Disk</div>
    <div class="row">Foto</div>
    <div class="row">Gmail</div>
    <div class="row">Kalender</div>
    <div class="row">Kamera</div>
    <div class="row">Klokke</div>
    <div class="row">Maps</div>
    <div class="row">Meldinger</div>
  </div>
  <div class="fade"></div>
</div>
<script src="glyphs.js"></script><script src="kit.js"></script>
</body></html>
