<!DOCTYPE html>
<html lang="en">
<head>
{% include "partials/head.html" %}
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="auth-brand">Vibb Phone</p>
    <h1 class="auth-title">Two-Factor Login</h1>
    <p class="auth-sub">Scan this with an authenticator app, then enter the 6-digit code it shows.</p>

    {% if let Some(e) = error %}
    <p class="flash flash-error auth-error" role="alert">{{ e }}</p>
    {% endif %}

    <div class="group">
        <div class="cell qr-code"><img src="data:image/png;base64,{{ qr_base64 }}" alt="QR code for your authenticator app" width="220" height="220"></div>
        <details class="info cell">
            <summary class="row"><span class="row-label">Can't scan it?</span><svg class="info-icon" viewBox="0 0 20 20" role="img" aria-label="Show the key" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
            <div class="info-panel"><p>Type this key into the app instead:</p><p class="secret-key">{{ secret_base32 }}</p></div>
        </details>
    </div>

    <form method="post" action="/auth/setup-2fa">
        <div class="group form-group">
            <div class="field">
                <label class="field-label" for="code">Code</label>
                <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
            </div>
        </div>
        <button type="submit" class="button-wide">Turn On</button>
    </form>
</main>
</body>
</html>
