<!DOCTYPE html>
<html lang="en">
<head>
{% include "partials/head.html" %}
</head>
<body>
{% let tab = "settings" %}
{% include "partials/tab_bar.html" %}
<main class="container">
    <a class="nav-back" href="/settings"><svg viewBox="0 0 12 20" aria-hidden="true" focusable="false"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Settings</a>
    <h1 class="page-title">Web Filter</h1>

    {#- Every form returns to its own group (design 31 §5.1), so a save never lands at the top, with
        or without JS. The switches and the picker save on change (autosave.js), with a <noscript>
        Save. Remove is one tap: a domain can be added again (§5.6). -#}
    <section id="lists" aria-labelledby="lists-title">
        <h2 class="group-header" id="lists-title">Blocklists</h2>
        <div class="group">
            {% for row in blocklists %}
            <form method="post" action="/dns/blocklists/{{ row.list.id }}/toggle#lists" class="cell" data-list="{{ row.list.id }}">
                <label class="row">
                    <span class="row-label">{{ row.list.name }}{% if !row.sub.is_empty() %}<span class="row-sub{% if row.failing %} text-alarm{% endif %}">{{ row.sub }}</span>{% endif %}</span>
                    <input type="checkbox" role="switch" class="sw" name="enabled" value="on"{% if row.list.enabled %} checked{% endif %} data-autosave><span class="knob" aria-hidden="true"></span>
                </label>
                <noscript><button type="submit" class="row row-button">Save</button></noscript>
            </form>
            {% if let Some(detail) = row.detail %}
            <details class="info cell" data-list-problem="{{ row.list.id }}">
                <summary class="row"><span class="row-label row-label-quiet">What happened</span><svg class="info-icon" viewBox="0 0 20 20" role="img" aria-label="Why {{ row.list.name }} has a problem" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel"><p>{{ detail }}</p></div>
            </details>
            {% endif %}
            {% else %}
            <p class="row row-note">No lists yet.</p>
            {% endfor %}
            <details class="disclosure cell" id="add-list"{% if refused == "lists" %} open{% endif %}>
                <summary class="row row-button">Add a List…</summary>
                <form method="post" action="/dns/blocklists/new#lists" class="form-group">
                    <div class="field">
                        <label class="field-label" for="bl_name">Name</label>
                        <input type="text" id="bl_name" name="name" value="{{ typed_name }}" maxlength="100" placeholder="My list" required>
                    </div>
                    <div class="field">
                        <label class="field-label" for="bl_url">Address</label>
                        <input type="url" id="bl_url" name="url" value="{{ typed_url }}" placeholder="https://…" required autocapitalize="none" spellcheck="false"{% if refused == "lists" %} aria-invalid="true" aria-describedby="list-error" autofocus{% endif %}>
                        {% if refused == "lists" %}<p class="field-error" id="list-error">Give it a name and an address starting with https://. Nothing was added.</p>{% else %}<p class="field-hint">A list of domains, one per line, as in a hosts file.</p>{% endif %}
                    </div>
                    <button type="submit" class="button-wide">Add List</button>
                </form>
            </details>
        </div>
        <p class="group-footer">On here, a list is on for every phone; a phone's own page can turn it off.</p>
    </section>

    <section id="blocked" aria-labelledby="blocked-title">
        <h2 class="group-header" id="blocked-title">Blocked Domains</h2>
        <div class="group">
            {% for d in blocked_domains %}
            <div class="row" data-domain="{{ d.id }}">
                <span class="row-label">{{ d.domain }}</span>
                <form method="post" action="/dns/domains/{{ d.id }}/delete#blocked" class="row-end">
                    <input type="hidden" name="list_type" value="block">
                    <button type="submit" class="row-action row-danger" aria-label="Remove {{ d.domain }}">Remove</button>
                </form>
            </div>
            {% endfor %}
            <form method="post" action="/dns/domains/new#blocked" class="cell">
                <input type="hidden" name="list_type" value="block">
                <div class="row">
                    <input type="text" class="row-input" name="domain" value="{% if refused == "blocked" %}{{ typed }}{% endif %}" placeholder="example.com" aria-label="Domain to block on every phone"{% if refused == "blocked" %} aria-invalid="true" autofocus{% endif %} required autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url" pattern="\s*[A-Za-z0-9_\-]+(\.[A-Za-z0-9_\-]+)+\.?\s*" title="A domain name, like example.com">
                    <button type="submit" class="row-action">Block</button>
                </div>
            </form>
            {% if refused == "blocked" %}<p class="flash flash-error" role="status" data-flash="blocked">That isn't a domain name, like example.com. Nothing was added.</p>{% endif %}
        </div>
        <p class="group-footer">Blocked on every phone, also when no list has it.</p>
    </section>

    <section id="allowed" aria-labelledby="allowed-title">
        <h2 class="group-header" id="allowed-title">Allowed Domains</h2>
        <div class="group">
            {% for d in allowed_domains %}
            <div class="row" data-domain="{{ d.id }}">
                <span class="row-label">{{ d.domain }}</span>
                <form method="post" action="/dns/domains/{{ d.id }}/delete#allowed" class="row-end">
                    <input type="hidden" name="list_type" value="allow">
                    <button type="submit" class="row-action row-danger" aria-label="Remove {{ d.domain }}">Remove</button>
                </form>
            </div>
            {% endfor %}
            <form method="post" action="/dns/domains/new#allowed" class="cell">
                <input type="hidden" name="list_type" value="allow">
                <div class="row">
                    <input type="text" class="row-input" name="domain" value="{% if refused == "allowed" %}{{ typed }}{% endif %}" placeholder="example.com" aria-label="Domain to allow on every phone"{% if refused == "allowed" %} aria-invalid="true" autofocus{% endif %} required autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url" pattern="\s*[A-Za-z0-9_\-]+(\.[A-Za-z0-9_\-]+)+\.?\s*" title="A domain name, like example.com">
                    <button type="submit" class="row-action">Allow</button>
                </div>
            </form>
            {% if refused == "allowed" %}<p class="flash flash-error" role="status" data-flash="allowed">That isn't a domain name, like example.com. Nothing was added.</p>{% endif %}
        </div>
        <p class="group-footer">Let through even when a list blocks it.</p>
    </section>

    {#- Design 31 step 5: a phone's own lists, domains and log are on its Web Filter page. -#}
    {% if !devices.is_empty() %}
    <section id="phones" aria-labelledby="phones-title">
        <h2 class="group-header" id="phones-title">Each Phone</h2>
        <div class="group">
            {% for d in devices %}
            <a class="row" href="/devices/{{ d.id }}/filter" data-phone="{{ d.id }}">
                <span class="row-label">{{ d.name }}</span>
                <svg class="chev" viewBox="0 0 8 14" aria-hidden="true" focusable="false"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            {% endfor %}
        </div>
        <p class="group-footer">A list off for one phone, its own domains, and its log.</p>
    </section>
    {% endif %}

    <section id="server" aria-labelledby="server-title">
        <h2 class="group-header" id="server-title">DNS Server</h2>
        {#- Design 36 §6: the picker saves itself; Custom Server is one form whose two fields are
            write-only (never filled from storage). A refused save renders in place (400) at
            #server with the typed values and each reason under its field. -#}
        <div class="group">
            <form method="post" action="/dns/upstream#server" class="cell">
                <label class="row" for="upstream">
                    <span class="row-label">Look-ups go to</span>
                    <select id="upstream" name="upstream" class="pick" data-autosave>
                        <option value="cloudflare"{% if server.choice == "cloudflare" %} selected{% endif %}>Cloudflare</option>
                        <option value="quad9"{% if server.choice == "quad9" %} selected{% endif %}>Quad9</option>
                        <option value="custom"{% if server.choice == "custom" %} selected{% endif %}>Custom server</option>
                    </select><svg class="pick-arrows" viewBox="0 0 10 16" aria-hidden="true" focusable="false"><path d="M2 6l3-3 3 3M2 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </label>
                <noscript><button type="submit" class="row row-button">Save</button></noscript>
            </form>
            <details class="disclosure cell" id="custom-server"{% if server.open %} open{% endif %}>
                <summary class="row"><span class="row-label">Custom Server<span class="row-sub">{% if let Some(hint) = server.server_hint %}{{ hint }}{% else %}Not set{% endif %}</span></span></summary>
                <form method="post" action="/dns/upstream/custom#server" class="form-group">
                    <div class="field">
                        <label class="field-label" for="custom_server">Your server</label>
                        <p class="field-hint" data-hint="server">{% if let Some(hint) = server.server_hint %}Set ({{ hint }}).{% else %}Not set.{% endif %}</p>
                        <input type="text" id="custom_server" name="custom_server" value="{{ server.typed_server }}" placeholder="https://… or a host name" maxlength="512" autocomplete="off" autocapitalize="none" spellcheck="false"{% if server.server_error.is_some() %} aria-invalid="true" aria-describedby="custom_server-error" autofocus{% endif %}>
                        {% if let Some(why) = server.server_error %}<p class="field-error" id="custom_server-error">{{ why }}</p>{% endif %}
                    </div>
                    <div class="field">
                        <label class="field-label" for="custom_backup">Backup server</label>
                        <p class="field-hint" data-hint="backup">{% if let Some(hint) = server.backup_hint %}Set ({{ hint }}).{% else %}Not set.{% endif %}</p>
                        <input type="text" id="custom_backup" name="custom_backup" value="{{ server.typed_backup }}" placeholder="https://1.1.1.3/dns-query" maxlength="512" autocomplete="off" autocapitalize="none" spellcheck="false"{% if server.backup_error.is_some() %} aria-invalid="true" aria-describedby="custom_backup-error"{% if server.server_error.is_none() %} autofocus{% endif %}{% endif %}>
                        {% if let Some(why) = server.backup_error %}<p class="field-error" id="custom_backup-error">{{ why }}</p>{% endif %}
                        <p class="field-hint">Answers while your server can't be reached. https://1.1.1.3/dns-query is Cloudflare for Families, over DNS-over-HTTPS, so it also answers on networks that block DNS-over-TLS.</p>
                        {% if server.both_names %}<p class="field-hint" data-hint="backup-ip">Give the backup as an IP address and no look-up ever leaves for anyone else.</p>{% endif %}
                    </div>
                    {% if server.stored %}
                    <label class="checkbox-row">
                        <input type="checkbox" name="forget_custom" value="on"{% if server.forget %} checked{% endif %}>
                        <span>Forget Custom Server</span>
                    </label>
                    {% endif %}
                    <button type="submit" class="button-wide">Save</button>
                </form>
            </details>
        </div>
        <div class="group-footer">{% if server.stale %}The saved addresses aren't accepted any more: type them again. Until then the phones use Cloudflare.{% else %}Where the phones look up sites that aren't blocked, encrypted.{% endif %}
            {% if !server.phones.is_empty() %}
            <ul class="phone-lines">
                {% for (id, line) in server.phones %}<li data-dns-phone="{{ id }}">{{ line }}</li>{% endfor %}
            </ul>
            {% endif %}
            <details class="info">
                <summary aria-label="About the DNS server"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel">
                    <p>Cloudflare is 1.1.1.1, Quad9 is 9.9.9.9, both over DNS-over-TLS (on a network that blocks it, over DNS-over-HTTPS to the same provider). Each phone filters by itself, on any network; this is where it asks about everything it lets through.</p>
                    <p>A custom server: a bare name or IP address means DNS-over-TLS on port 853; for DNS-over-HTTPS type the https:// address. The phone checks the server's certificate, so an IP address works only if the certificate names it. On a network that blocks port 853 a DNS-over-TLS server can't be reached; a DNS-over-HTTPS backup still answers.</p>
                    <p>The phone reaches your server directly over its mobile data or Wi-Fi, not through Tailscale: a server on your home network works on the home Wi-Fi, and the backup answers elsewhere. An id in the https:// path stays inside the encryption. The phone's own lists still block first.</p>
                </div>
            </details>
        </div>
    </section>
</main>
</body>
</html>
