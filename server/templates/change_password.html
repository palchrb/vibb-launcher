<!DOCTYPE html>
<html lang="{{ lang.code() }}">
<head>
{% include "partials/head.html" %}
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="auth-brand">Vibb Phone</p>
    <h1 class="auth-title">New Password</h1>
    <p class="auth-sub">You signed in with a generated password. Choose your own to go on.</p>

    {% if let Some(e) = error %}
    <p class="flash flash-error auth-error" role="alert">{{ e }}</p>
    {% endif %}

    <form method="post" action="/auth/change-password">
        <div class="group form-group">
            <div class="field">
                <label class="field-label" for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" autocomplete="current-password" required autofocus>
            </div>
            <div class="field">
                <label class="field-label" for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="12" required>
                <p class="field-hint">At least 12 characters.</p>
            </div>
            <div class="field">
                <label class="field-label" for="confirm_password">New password again</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>
            </div>
        </div>
        <button type="submit" class="button-wide">Change Password</button>
    </form>
</main>
</body>
</html>
