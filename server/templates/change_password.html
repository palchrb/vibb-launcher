<!DOCTYPE html>
<html lang="{{ lang.code() }}">
<head>
{% include "partials/head.html" %}
</head>
<body class="auth-page">
<div class="top-strip" aria-hidden="true"></div>
{% include "partials/js_words.html" %}
<main class="auth-card">
    <p class="auth-brand">Vibb Phone</p>
    <h1 class="auth-title">{{ self.t("auth.change_password.title") }}</h1>
    <p class="auth-sub">{{ self.t("auth.change_password.sub") }}</p>

    {% if let Some(e) = error %}
    <p class="flash flash-error auth-error" role="alert">{{ e }}</p>
    {% endif %}

    <form method="post" action="/auth/change-password">
        <div class="group form-group">
            <div class="field">
                <label class="field-label" for="current_password">{{ self.t("account.password.current") }}</label>
                <input type="password" id="current_password" name="current_password" autocomplete="current-password" required autofocus>
            </div>
            <div class="field">
                <label class="field-label" for="new_password">{{ self.t("account.password.new") }}</label>
                <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="12" required>
                <p class="field-hint">{{ self.t("account.password.new_hint") }}</p>
            </div>
            <div class="field">
                <label class="field-label" for="confirm_password">{{ self.t("account.password.again") }}</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>
            </div>
        </div>
        <button type="submit" class="button-wide">{{ self.t("account.password.change") }}</button>
    </form>
</main>
</body>
</html>
