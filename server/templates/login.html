<!DOCTYPE html>
<html lang="en">
<head>
{% include "partials/head.html" %}
</head>
<body class="auth-page">
<main class="auth-card">
    <h1 class="auth-title">Vibb Phone</h1>
    <p class="auth-sub">Sign in to look after your family's phones.</p>

    {% if let Some(e) = error %}
    <p class="flash flash-error auth-error" role="alert">{{ e }}</p>
    {% endif %}

    <form method="post" action="/login">
        <div class="group form-group">
            <div class="field">
                <label class="field-label" for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
            </div>
            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
        </div>
        <button type="submit" class="button-wide">Sign In</button>
    </form>
</main>
</body>
</html>
