<!DOCTYPE html>
<html lang="{{ lang.code() }}">
<head>
{% include "partials/head.html" %}
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="auth-brand">Vibb Phone</p>
    <h1 class="auth-title">Two-Factor Code</h1>
    <p class="auth-sub">Enter the 6-digit code from your authenticator app.</p>

    {% if let Some(e) = error %}
    <p class="flash flash-error auth-error" role="alert">{{ e }}</p>
    {% endif %}

    <form method="post" action="/auth/verify-2fa">
        <div class="group form-group">
            <div class="field">
                <label class="field-label" for="code">Code</label>
                <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
            </div>
        </div>
        <button type="submit" class="button-wide">Sign In</button>
    </form>
</main>
</body>
</html>
