<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ title }} · Vibb Phone</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/static/style.css?v=45">
<!-- The headings' Nunito, from this server only (style.css's @font-face). -->
<link rel="preload" href="/static/fonts/nunito-latin-wght.woff2" as="font" type="font/woff2" crossorigin>

<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
{#- The status bar takes the top's colour: Devices' night band in both schemes (its `night_top`), else the ground. -#}
{% if night_top is defined %}
<meta name="theme-color" content="#0C0C14">
{% else %}
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C14" media="(prefers-color-scheme: dark)">
{% endif %}
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vibb Phone">
<script src="/static/register-sw.js?v=3" defer></script>
<!-- No POST may make the page jump to the top (server/CLAUDE.md): static/scroll-restore.js. Not
     deferred, so form.submit() is hooked before any control can call it. -->
<script src="/static/scroll-restore.js?v=5"></script>
<!-- Controls marked data-autosave save their form on change (design 31 §5.2), through the hooked
     form.submit(). Not deferred either: it only listens on the document, so a switch tapped while a
     long page is still loading saves too (qa-31-s1-code L1). -->
<script src="/static/autosave.js?v=2"></script>
<!-- A tap is never "nothing" after being away (2026-10-21): the tapped link marked and a thin bar at
     once, "Connecting…" after 3 s and the same navigation again by itself once the server answers;
     after 10 minutes hidden a ping and a reload in place that keeps the scroll place. -->
<script src="/static/reconnect.js?v=2" defer></script>
