{#- The Music tab's own styles (design 31 §3.4): the library rows and their status, the Add forms,
    the category editor, the import preview, the shelf and an entry's files. On the shared tokens;
    kept with the music pages so style.css needs no new version for them. -#}
<style>
.title-bar { display: flex; justify-content: flex-end; min-height: 44px; }
.title-action { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; color: var(--tint); font-size: 1.0625rem; text-decoration: none; }
.tile-orange { background: #C2410C; }
.group-music { --avatar-inset: 72px; }
.music-card { position: relative; }
.group-music > .music-card ~ .music-card::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 1px solid var(--sep-light); pointer-events: none; }
.music-cover, .music-tile { flex: none; width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
.music-tile { display: flex; align-items: center; justify-content: center; }
.music-tile img { width: 26px; height: 26px; }
.music-tile-small { width: 29px; height: 29px; border-radius: 7px; }
.music-tile-small img { width: 18px; height: 18px; }
.music-row .row-label { min-width: 0; }
.music-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-missing { color: var(--red-text); font-weight: 600; }
.music-status { margin: 2px 0 0; font-size: 0.8125rem; line-height: 1.3; color: var(--label-2); overflow-wrap: anywhere; }
.music-status-busy { color: var(--orange-text); }
.music-status-error { color: var(--red-text); }
.group-music .music-status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-actions { display: flex; flex-wrap: wrap; align-items: center; padding: 0 16px 10px 72px; margin-top: -4px; }
.music-actions > * { margin: 4px 16px 0 0; }
.music-actions form { display: flex; align-items: center; }
.music-actions .button-small { margin: 0; }
.music-actions label { margin: 0 8px 0 0; font-size: 0.9375rem; font-weight: 400; color: var(--label-2); }
.music-actions select.pick { max-width: 12rem; color: var(--tint); font-size: 0.9375rem; }
.music-after { font-size: 0.8125rem; color: var(--label-2); }
details.add-form > summary, details.category-block > summary { list-style: none; cursor: pointer; }
details.add-form > summary::-webkit-details-marker, details.category-block > summary::-webkit-details-marker { display: none; }
details.add-form[open] > summary .section-chev, details.info[open] > summary .section-chev,details.category-block[open] > summary .section-chev { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
details.add-form > form, details.category-block > .category-body { padding-top: 0; }
.category-body { padding: 0 16px 16px; }
.category-body .admin-actions { margin-top: 12px; }
.category-body .confirm-body { padding: 8px 0 0; }
.cover-row { display: flex; align-items: center; padding: 12px 16px; }
.cover-row > * + * { margin-left: 16px; }
.cover-big { width: 96px; height: 96px; border-radius: 16px; object-fit: cover; flex: none; }
.music-art { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; }
.file-cell > summary { list-style: none; cursor: pointer; }
.file-cell > summary::-webkit-details-marker { display: none; }
.file-delete { color: var(--red); }
.form-group > .field-switch { padding: 0; margin: 0 0 16px; }
.import-section { padding: 0 0 4px; }
.import-row { display: flex; align-items: flex-start; }
.import-row input[type="checkbox"] { flex: none; width: 22px; height: 22px; margin: 1px 12px 0 0; }
.import-skip { color: var(--red-text); }
.st-row { display: flex; align-items: flex-start; }
.st-row input[type="checkbox"] { flex: none; width: 22px; height: 22px; margin: 1px 12px 0 0; }
.st-books { list-style: none; padding: 0; margin: 0; }
.st-books li { overflow-wrap: anywhere; padding: 2px 0; }
.form-group select { width: 100%; }
</style>
