<!DOCTYPE html>
<html lang="{{ lang.code() }}">
<head>
{% include "partials/head.html" %}
</head>
<body>
{% let tab = "devices" %}
{% include "partials/tab_bar.html" %}
<main class="container">
    <a class="nav-back" href="/devices/{{ device_id }}"><svg viewBox="0 0 12 20" aria-hidden="true" focusable="false"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>{{ device_name }}</a>
    <h1 class="page-title">{{ title }}</h1>

    {#- Design 69 §3. The switches and selects save on change (autosave.js) and return to their group (#dagen,
        #lock, #calendars); <noscript> Save without JS. The calendars are one form that writes exactly the rows it
        was sent. Title rules: each row's up/down returns to the row (#rule-<id>). Nothing here holds an event: the
        calendars are the phone's last report. -#}
    {% if !capable %}
    <div class="attention attention-action" data-warning="calendar-not-capable"><div class="attention-text">{{ self.t("calendar.not_capable") }}<div class="attention-sub">{{ self.t("calendar.not_capable_sub") }}</div></div></div>
    {% endif %}

    <section id="dagen" aria-labelledby="dagen-title">
        <h2 class="group-header" id="dagen-title">{{ self.t("calendar.dagen.title") }}</h2>
        <form method="post" action="/devices/{{ device_id }}/calendar/dagen#dagen" class="group">
            <label class="row">
                <span class="row-label">{{ self.t("calendar.dagen.on_home") }}<span class="row-sub">{{ self.t("calendar.dagen.on_home_sub") }}</span></span>
                <input type="checkbox" role="switch" class="sw" name="on_home" value="on"{% if on_home %} checked{% endif %} data-autosave><span class="knob" aria-hidden="true"></span>
            </label>
            <label class="row row-stacked">
                <span class="row-label">{{ self.t("calendar.kid.label") }}</span>
                <select class="pick" name="kid" data-autosave>
                    {% for k in kid_choices %}<option value="{{ k.value }}"{% if k.selected %} selected{% endif %}>{{ k.label }}</option>{% endfor %}
                </select><svg class="pick-arrows" viewBox="0 0 10 16" aria-hidden="true" focusable="false"><path d="M2 6l3-3 3 3M2 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </label>
            <noscript><button type="submit" class="row row-button">{{ self.t("common.save") }}</button></noscript>
        </form>
        <div class="group-footer" data-footer="dagen">{{ self.t("calendar.dagen.footer") }}
            <details class="info">
                <summary aria-label="{{ self.t("calendar.dagen.info_label") }}"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel">
                    <p>{{ self.t("calendar.dagen.info") }}</p>
                </div>
            </details>
        </div>
    </section>

    <section id="lock" aria-labelledby="lock-title">
        <h2 class="group-header" id="lock-title">{{ self.t("calendar.lock.title") }}</h2>
        <form method="post" action="/devices/{{ device_id }}/calendar/lock#lock" class="group">
            <label class="row">
                <span class="row-label">{{ self.t("calendar.lock.next") }}<span class="row-sub">{{ self.t("calendar.lock.next_sub") }}</span></span>
                <input type="checkbox" role="switch" class="sw" name="glance_next" value="on"{% if glance_next %} checked{% endif %} data-autosave><span class="knob" aria-hidden="true"></span>
            </label>
            <label class="row">
                <span class="row-label">{{ self.t("calendar.lock.reminders") }}<span class="row-sub">{{ self.t("calendar.lock.reminders_sub") }}</span></span>
                <select class="pick" name="reminders" data-autosave>
                    <option value="off"{% if !reminders_row %} selected{% endif %}>{{ self.t("calendar.lock.reminders.off") }}</option>
                    <option value="row"{% if reminders_row %} selected{% endif %}>{{ self.t("calendar.lock.reminders.row") }}</option>
                </select><svg class="pick-arrows" viewBox="0 0 10 16" aria-hidden="true" focusable="false"><path d="M2 6l3-3 3 3M2 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </label>
            <noscript><button type="submit" class="row row-button">{{ self.t("common.save") }}</button></noscript>
        </form>
        <div class="group-footer" data-footer="lock">{{ self.t("calendar.lock.footer") }}
            <details class="info">
                <summary aria-label="{{ self.t("calendar.lock.info_label") }}"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel">
                    <p>{{ self.t("calendar.lock.info") }}</p>
                    <p>{{ self.t("calendar.lock.example_caption") }}</p>
                    {#- The reminder row as the lock draws it (design 69 §5.2: #1B1B28, 16 dp corners, the calendar glyph, the
                        title counting down, the start under it), on the night ground. -#}
                    <svg class="calendar-example" viewBox="0 0 280 72" role="img" aria-label="{{ self.t("calendar.lock.example") }}, {{ self.t("calendar.lock.example_time") }}">
                        <rect width="280" height="72" rx="14" fill="#0C0C14"/>
                        <rect x="8" y="8" width="264" height="56" rx="12" fill="#1B1B28"/>
                        <circle cx="38" cy="36" r="18" fill="#2C2C3E"/>
                        <g fill="none" stroke="#F0A884" stroke-width="1.6" stroke-linejoin="round">
                            <rect x="29" y="29" width="18" height="16" rx="2.5"/>
                            <path d="M29 34h18M33 26.5v4M43 26.5v4" stroke-linecap="round"/>
                        </g>
                        <text x="66" y="32" fill="#FFFFFF" font-size="15" font-weight="600">{{ self.t("calendar.lock.example") }}</text>
                        <text x="66" y="51" fill="#A9A9BC" font-size="13">{{ self.t("calendar.lock.example_time") }}</text>
                    </svg>
                </div>
            </details>
        </div>
    </section>

    {#- Design 72 §5: the phone's calendar links. Each row's name saves on change and returns to it (#link-<uid>);
        Fetch now and Remove too (Remove back to #links). The link itself is sealed on the server and never shown
        again - only its host. A refused add renders this page again (400) with the form as typed. -#}
    <section id="links" aria-labelledby="links-title">
        <h2 class="group-header" id="links-title">{{ self.t("calendar.links.title") }}</h2>
        {% if let Some(key) = links_notice %}<p class="flash" role="status" data-flash="fetch-wait">{{ self.t(key) }}</p>{% endif %}
        {% if let Some(why) = add.error %}<p class="flash flash-error" role="alert" data-flash="link-refused">{{ why }}</p>{% endif %}
        <div class="group">
            {% for l in links %}
            <div class="cell" id="link-{{ l.uid }}" data-link="{{ l.uid }}">
                <form method="post" action="/devices/{{ device_id }}/calendar/links/{{ l.uid }}/name#link-{{ l.uid }}">
                    <label class="row">
                        <span class="row-label">{{ self.t("calendar.links.name") }}</span>
                        <input type="text" class="row-input row-input-end" name="name" value="{{ l.name }}" maxlength="60" autocomplete="off" data-autosave>
                    </label>
                    <noscript><button type="submit" class="row row-button">{{ self.t("common.save") }}</button></noscript>
                </form>
                <div class="row"><span class="row-label">{{ l.host }}{% for line in l.lines %}<span class="row-sub"{% if loop.first && l.failing %} data-link-failing{% endif %}>{{ line }}</span>{% endfor %}</span></div>
                <form method="post" action="/devices/{{ device_id }}/calendar/links/{{ l.uid }}/fetch#link-{{ l.uid }}">
                    <button type="submit" class="row row-button">{{ self.t("calendar.links.fetch_now") }}</button>
                </form>
                <details class="confirm cell">
                    <summary class="row row-danger">{{ self.t("calendar.links.remove") }}&hellip;</summary>
                    <form method="post" action="/devices/{{ device_id }}/calendar/links/{{ l.uid }}/remove#links" class="confirm-body">
                        <p>{{ self.t("calendar.links.remove_confirm") }}</p>
                        <button type="submit" class="button-destructive">{{ self.t("calendar.links.remove") }}</button>
                    </form>
                </details>
            </div>
            {% endfor %}
            {% if links_off %}
            <p class="row row-sub" data-links="off">{{ self.t("calendar.links.no_key") }}</p>
            {% else if can_add_link %}
            <form method="post" action="/devices/{{ device_id }}/calendar/links#links" data-links="add">
                <label class="row row-stacked">
                    <span class="row-label">{{ self.t("calendar.links.url") }}</span>
                    <input type="url" class="row-input" name="url" value="{{ add.url }}" maxlength="2100" placeholder="webcal://…" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" required{% if add.error.is_some() %} autofocus{% endif %}>
                </label>
                <label class="row row-stacked">
                    <span class="row-label">{{ self.t("calendar.links.name_optional") }}</span>
                    <input type="text" class="row-input" name="name" value="{{ add.name }}" maxlength="60" autocomplete="off">
                </label>
                <button type="submit" class="row row-button">{{ self.t("calendar.links.add") }}</button>
            </form>
            {% else %}
            <p class="row row-sub" data-links="full">{{ self.t("calendar.links.full") }}</p>
            {% endif %}
        </div>
        <div class="group-footer" data-footer="links">{{ self.t("calendar.links.footer") }}
            <details class="info">
                <summary aria-label="{{ self.t("calendar.links.info_label") }}"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel">
                    <p>{{ self.t("calendar.links.info") }}</p>
                    <p>{{ self.t("calendar.links.info_privacy") }}</p>
                </div>
            </details>
        </div>
    </section>

    <section id="calendars" aria-labelledby="calendars-title">
        <h2 class="group-header" id="calendars-title">{{ self.t("calendar.calendars.title") }}</h2>
        {% match state %}
        {% when ReportState::NoReport %}
        <p class="group-footer" data-calendars="no-report">{{ self.t("calendar.calendars.no_report") }}</p>
        {% when ReportState::Unreadable %}
        <p class="group-footer" data-calendars="unreadable">{{ self.t("calendar.calendars.unreadable") }}</p>
        {% when ReportState::NoCalendars %}
        <p class="group-footer" data-calendars="none">{{ self.t("calendar.calendars.none") }}</p>
        {% when ReportState::Listed %}
        {% endmatch %}
        {% if !calendars.is_empty() %}
        <form method="post" action="/devices/{{ device_id }}/calendar/calendars#calendars" class="group">
            {% for c in calendars %}
            <input type="hidden" name="key" value="{{ c.key }}">
            <div class="cell{% if !c.on_phone %} row-dim{% endif %}" data-calendar="{{ c.key }}">
                <label class="row">
                    <span class="row-label">{{ c.name }}<span class="row-sub">{{ c.sub }}</span></span>
                    <input type="checkbox" role="switch" class="sw" name="shown_{{ c.key }}" value="on" aria-label="{{ self.t("calendar.calendars.shown") }}"{% if c.shown %} checked{% endif %} data-autosave><span class="knob" aria-hidden="true"></span>
                </label>
                <label class="row">
                    <span class="row-label">{{ self.t("calendar.calendars.reminder") }}{% if !reminders_row %}<span class="row-sub" data-reminders-off>{{ self.t("calendar.calendars.reminders_off") }}</span>{% endif %}</span>
                    <select class="pick" name="remind_{{ c.key }}" data-autosave>
                        {% for r in c.reminds %}<option value="{{ r.value }}"{% if r.selected %} selected{% endif %}>{{ r.label }}</option>{% endfor %}
                    </select><svg class="pick-arrows" viewBox="0 0 10 16" aria-hidden="true" focusable="false"><path d="M2 6l3-3 3 3M2 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </label>
                {% if !c.on_phone %}
                <button type="submit" class="row row-button row-danger" formaction="/devices/{{ device_id }}/calendar/calendars/{{ c.key }}/remove#calendars">{{ self.t("calendar.calendars.remove") }}</button>
                {% endif %}
            </div>
            {% endfor %}
            <noscript><button type="submit" class="row row-button">{{ self.t("common.save") }}</button></noscript>
        </form>
        <div class="group-footer" data-footer="calendars">{{ self.t("calendar.calendars.footer") }}
            <details class="info">
                <summary aria-label="{{ self.t("calendar.calendars.info_label") }}"><svg class="info-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg></summary>
                <div class="info-panel">
                    <p>{{ self.t("calendar.calendars.info") }}</p>
                </div>
            </details>
        </div>
        {% endif %}
        {% if state != ReportState::Listed %}
        <p class="group-footer">{{ self.t("calendar.calendars.setup") }}</p>
        {% endif %}
    </section>

    <section id="rules" aria-labelledby="rules-title">
        <h2 class="group-header" id="rules-title">{{ self.t("calendar.rules.title") }}</h2>
        {% if let Some(key) = notice %}<p class="flash flash-error" role="alert" data-flash="rule-gone">{{ self.t(key) }}</p>{% endif %}
        {% if !rules_skipped.is_empty() %}<p class="flash flash-error" data-flash="rules-skipped">{{ self.skipped_line() }}</p>{% endif %}
        <div class="group">
            {% for r in rules %}
            <div class="row calendar-rule" id="rule-{{ r.id }}">
                <a class="row-label" href="/devices/{{ device_id }}/calendar/rules/{{ r.id }}">{{ r.n }}. {{ r.text }}</a>
                <form method="post" action="/devices/{{ device_id }}/calendar/rules/{{ r.id }}/move#rule-{{ r.id }}" class="calendar-rule-move">
                    {% if !r.first %}<button type="submit" class="row-action" name="dir" value="up" aria-label="{{ self.t("calendar.rules.up") }}">&uarr;</button>{% endif %}
                    {% if !r.last %}<button type="submit" class="row-action" name="dir" value="down" aria-label="{{ self.t("calendar.rules.down") }}">&darr;</button>{% endif %}
                </form>
            </div>
            {% endfor %}
            {% if can_add_rule %}
            <a class="row row-button" href="/devices/{{ device_id }}/calendar/rules/new">{{ self.t("calendar.rules.add") }}&hellip;</a>
            {% endif %}
        </div>
        <p class="group-footer">{{ self.t("calendar.rules.footer") }}</p>
    </section>
</main>
</body>
</html>
