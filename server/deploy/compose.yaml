# Vibb Phone server in Docker (server >= 0.23.0) - server/DEPLOY.md, "Docker".
#
# Copy this file and env.example (as .env) to a folder on the host, fill in .env, make the backups folder, then:
#   mkdir -p backups && sudo chown 65532:65532 backups && sudo chmod 700 backups
#   docker compose up -d
#   docker compose cp handy:/app/data/initial-admin-password . && cat initial-admin-password && rm initial-admin-password
# Sign in as admin and change the password.
#
# The host's network: the host's Tailscale and Caddy (Caddyfile.example) put HTTPS in front, and the server sees the
# real client address, which its admin gate needs. It listens on 127.0.0.1 only (BIND_ADDR, DEVICE_BIND_ADDR).
# Updating, either way (DEPLOY.md "Updating"; the server never updates itself):
# - Watchtower, with HANDY_VERSION=latest: automatic; nothing checks who built the image - the operator's own risk.
# - ./update-image.sh X.Y.Z (next to this file): checks the release's build attestation first, then pins the version
#   and the digest (HANDY_DIGEST=@sha256:...) in .env and runs `docker compose up -d`.
# - ./update-image.sh --auto on handy-update.timer: the same check for each new release, daily (DEPLOY.md "Automatic,
#   verified updates"); then turn Watchtower off for this service, e.g.
#   labels: ["com.centurylinklabs.watchtower.enable=false"]
services:
  handy:
    image: ghcr.io/palchrb/handy-server:${HANDY_VERSION}${HANDY_DIGEST:-}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - handy-data:/app/data
      # The backups (zips, pre-migration and pre-restore copies) in a folder on the host, so the host's own backup
      # takes them. It must belong to uid 65532: mkdir -p backups && sudo chown 65532:65532 backups && sudo chmod 700 backups
      - ./backups:/app/data/backups
      # The Storytel, Web Push, Child PIN and Apple cache keys: their own volume, never in the data volume or the backups
      # folder.
      - handy-keys:/app/data/keys
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Tor for the Apple Wi-Fi lookup (design 125, off per phone until the parent turns it on; DEPLOY.md, "The Apple
  # Wi-Fi lookup"): a SOCKS5 proxy on 127.0.0.1:9050 of the host, nothing else. .env's
  # WIFI_LOOKUP_PROXY=socks5h://127.0.0.1:9050 sends every Apple call through it, each on a circuit of its own; set,
  # a call never goes direct. Built here from Debian's package on a base image pinned by digest - move it on
  # deliberately (`docker buildx imagetools inspect debian:trixie-slim`) and `docker compose build tor` for Tor's
  # updates (Watchtower doesn't rebuild it). Not wanted: delete this service and the line in .env.
  tor:
    build:
      dockerfile_inline: |
        FROM debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
        RUN apt-get update && apt-get install -y --no-install-recommends tor && rm -rf /var/lib/apt/lists/*
        USER debian-tor
        CMD ["tor", "--SocksPort", "127.0.0.1:9050", "--DataDirectory", "/var/lib/tor"]
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Built here, so there is nothing to pull: keep Watchtower from trying (and logging a failure every round).
    labels: ["com.centurylinklabs.watchtower.enable=false"]
    volumes:
      - tor-data:/var/lib/tor

volumes:
  handy-data: {}
  handy-keys: {}
  tor-data: {}
